<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>青年宫</title>
  </head>
  <body>
    <div>
      <label>
        接口地址(url)：
        <input id="urlInput" type="text" value="https://61.158.166.42:52666" />
      </label>
    </div>
    <div>
      <label>
        access_token：
        <input
          id="accessTokenInput"
          type="text"
          value="eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJqd3RwYXNzd2RAMjAyNCIsImlzcyI6Imp3dHBhc3N3ZEAyMDI0IiwiY2xhaW0iOnsic3VwZXJfYWRtaW4iOjEsImFsbG93X2Rvd24iOnRydWUsIm5hbWUiOiLpnZLlubTlrqvkuK3lv4MiLCJhZG1pbiI6MSwicGVybWlzc2lvbiI6MSwiZGVjcnlwdCI6IiIsImhpZGVUZWwiOiIiLCJhbGxfcHJvamVjdHMiOnRydWUsImFsbG93X2luc3BlY3Rpb24iOnRydWV9LCJleHAiOjE3Njg2NzUxNDN9.aYjxgAyFpnliZsVDNQnqIOch625vWOBjIW2xqRJBb_0"
        />
      </label>
    </div>
    <div>
      <label>
        project_id：
        <input id="projectIdInput" type="number" value="1" />
      </label>
    </div>
    <div>
      <label>
        开始日期：
        <input id="startDateInput" type="date" value="2026-01-12" />
      </label>
    </div>
    <div>
      <label>
        结束日期：
        <input id="endDateInput" type="date" value="2026-01-17" />
      </label>
    </div>
    <button id="fetchButton">获取任务报告</button>
    <div id="taskContainer"></div>
  </body>
  <script>
    const fetchButton = document.getElementById("fetchButton");
    fetchButton.addEventListener("click", async () => {
      const url = document.getElementById("urlInput").value.trim();
      const access_token = document.getElementById("accessTokenInput").value.trim();
      const project_id = document.getElementById("projectIdInput").value.trim();
      const startDateStr = document.getElementById("startDateInput").value;
      const endDateStr = document.getElementById("endDateInput").value;

      const container = document.getElementById("taskContainer");
      container.innerHTML = "";

      const startDate = new Date(startDateStr);
      const endDate = new Date(endDateStr);

      if (
        !startDateStr ||
        !endDateStr ||
        isNaN(startDate) ||
        isNaN(endDate) ||
        startDate > endDate
      ) {
        return;
      }

      const myHeaders = new Headers();
      myHeaders.append("access_token", access_token);

      const requestOptions = {
        method: "POST",
        headers: myHeaders,
        redirect: "follow",
      };

      for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        const date = year + "-" + month + "-" + day;

        try {
          const response = await fetch(
            url +
              "/admin/getTaskReport?page=1&limit=10&project_id=" +
              project_id +
              "&date=" +
              date +
              "&type=0&task_ids=",
            requestOptions
          );
          const result = await response.json();
          if (Array.isArray(result.data)) {
            const sorted = result.data.slice().sort((a, b) => {
              const pa = parseFloat(a.successfulPercent) || 0;
              const pb = parseFloat(b.successfulPercent) || 0;
              return pb - pa;
            });
            const section = document.createElement("div");
            const title = document.createElement("h3");
            title.textContent = date;
            section.appendChild(title);
            const list = document.createElement("ul");
            sorted.slice(0, 10).forEach((item) => {
              const li = document.createElement("li");
              li.textContent = item.taskName + " - 成功率: " + item.successfulPercent + "%";
              list.appendChild(li);
            });
            section.appendChild(list);
            container.appendChild(section);
          }
        } catch (error) {
          console.error(error);
        }
      }
    });
  </script>
</html>
