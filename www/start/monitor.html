<script>
	layui.config({
		base: '../src/',
		version: new Date().getTime()
	}).extend().use('index');

	var urls = location.href;
	var req_project_id = urlToObj(urls).id;
	var interval = 0;
	var taskInterval = 0;    // 专门用于 taskReportData (任务报表)
	var url = '/../';
	var timestamp = "";
	var table;
	var taskTableIns = null;

	var monitorData = {}; //moitor 实时数据

	var echarts2 = echarts;

	var initNum = 0;

	let intervalControlAllData = null
	let echartsMapData = [];
	let active6IsHaveData = 0; //判断实时监控网关是否有数据
	const echartsTitleMap = {
		answerList: '实时应答数',
		callList: '实时应答率(百分比)',
		concurrencyList: '实时并发数',
		transferList: '实时转接率(百分比)',
		zeroTicketList: '实时秒挂数',
		progressList : '忙碌坐席数'
	}
	const colors = ['#5a6fc0', '#9eca7f', '#f2ca6b', '#de6e6a', '#85bedb']

	layui.use(['dropdown', 'form', 'table', 'carousel'], function () {
		table = layui.table;
		form = layui.form;
		var $ = layui.$;
		router = layui.router();
		view = layui.view;
		admin = layui.admin;
		setter = layui.setter;
		carousel = layui.carousel;
		element = layui.element;
		device = layui.device();

		//console.log(url)
		var dropdown = layui.dropdown;
		//轮播切换
		$('.layadmin-carousel').each(function () {
			var othis = $(this);
			carousel.render({
				elem: this,
				width: '100%',
				height: '100%',
				arrow: 'none',
				interval: othis.data('interval'),
				autoplay: othis.data('autoplay') === true,
				trigger: (device.ios || device.android) ? 'click' : 'hover',
				anim: othis.data('anim')
			});
		});
		element.render('progress');
		var date = new Date();
		var year = date.getFullYear();
		var month = date.getMonth() + 1;
		if (month < 10) {
			month = "0" + month;
		}
		var day = date.getDate();
		if (day < 10) {
			day = "0" + day;
		}
		timestamp = year + "-" + month + "-" + day;
		if (layui.data('layuiAdmin')[window.sessionStorage.getItem("name")] == undefined) {
			layer.msg("访问令牌失效,请重新打开", {
				icon: 2
			});
			return;
		}







		$.ajax({ //执行项目下拉列表
			type: "POST",
			url: url + "admin/project/list",
			dataType: 'json',
			headers: {
				access_token: layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["access_token"]
			},
			success: function (res) {
				if (res.msg == "访问令牌失效") {
					layer.msg("访问令牌失效,请重新打开", {
						icon: 2
					})
				} else {
					var result = res.data;
					for (var i = 0; i < result.length; i++) {
						$("#project_active").append("<option value=" + result[i].id + ">" +
							result[i].name + "</option>");
					}
					$("#project_active").val(req_project_id);
					layui.form.render("select");

					getProject(req_project_id);
					monitor_tool.monitor(req_project_id);
					getProjectReport(req_project_id, timestamp);
					getProjectTaskReport(req_project_id, timestamp);
				}
			}
		});
		carousel.on('change(LAY-index-pagethree)', function (obj) { //监听轮播图
			clearInterval(interval);
			// 2. 【新增】清除任务报表定时器 (防止重复)
			if(taskInterval) {
					clearInterval(taskInterval);
					taskInterval = 0;
			}

			active6IsHaveData = 0;
			$("#agents").empty();
			var project_id = $("#project_active").val();
			if (obj.index == 3) {
				// layui.use(['admin', 'echarts'], function () {
				// 	echarts1 = layui.echarts;
				// 	admin = layui.admin;
				// 	echarts_earth();
				// })
				echarts_earth();
			} else if (obj.index == 1) {
				taskReportData(project_id, timestamp);
				taskInterval = setInterval(function () {
					taskReportData(project_id, timestamp);
				}, 5000);
			} else if (obj.index == 2) {
				projectReportData(project_id);
			} else if (obj.index == 4) {
				form.render('select');
				echarts_init();



			}
			monitor_tool.monitor(project_id);
			element.render();

		});
		form.on('select(project_active)', function (data) { //监听项目下拉框
			clearInterval(interval);
			$("#agents").empty();
			initNum = 0;
			var project_id = data.value;
			if (layui.data('layuiAdmin')[window.sessionStorage.getItem("name")] == undefined) {
				layer.msg("访问令牌失效,请重新打开", {
					icon: 2
				});
				return;
			} else {

				if (project_id == 0) {
					$("#outbound_param").val(0);
					$("#应答率").val(0);
					$("#成功率").val(0);
				} else {
					getProject(project_id);
					monitor_tool.monitor(project_id);
					getProjectReport(project_id, timestamp);
					getProjectTaskReport(project_id, timestamp);
				}

				echarts_init();
			}
			console.log("initNum:" + initNum)
		})
		form.on('submit(sendmsg)', function (data) {
			$.ajax({
				url: url + 'admin/project/sendMessage',
				type: 'post',
				headers: {
					access_token: layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["access_token"]
				},
				data: {
					project_id: $("#project_active").val(),
					message: $("#semdMsg_msg").val()
				},
				success: function (obj) {
					layer.closeAll('loading');
					layer.msg("发送成功", {
						icon: 1
					});
					$("#semdMsg_msg").val("")
				}
			})
			return false;
		})
	})

	function urlToObj(str) { //截取url
		var obj = {};

		var arr1 = str.split("?");
		//var arr2 = arr1[1].split("&");　　
		for (var i = 0; i < arr1.length; i++) {
			var res = arr1[i].split("=");
			obj[res[0]] = res[1];
		}
		return obj;
	}

	function refrush() { //刷新按钮
		clearInterval(interval);
		var p_id = $("#project_active").val();
		if (layui.data('layuiAdmin')[window.sessionStorage.getItem("name")] == undefined) {
			layer.msg("访问令牌失效,请重新打开", {
				icon: 2
			});
			return;
		} else {

	function getFormattedTaskReportData(res) {
		var data = [];
		for (let i = 0; i < res.data.length; i++) {
			var element = res.data[i];
			var avgAnswerBillsec = 0
			if (!element.seconds || !element.answer) {
				avgAnswerBillsec = 0;
			} else {
				avgAnswerBillsec = (element.seconds / element.answer).toFixed(2);
			}
			element['avgAnswerBillsec'] = avgAnswerBillsec;
			data.push(element);
		}

		//By:hy 修改排序规则，先按状态排序，再按成功统计排序 2026-02-03 14:30:00
		data.sort(function (a, b) {
			var aStatus = (a.status != 0) ? 1 : 0;
			var bStatus = (b.status != 0) ? 1 : 0;
			if (aStatus != bStatus) {
				return bStatus - aStatus;
			}
			var aSucc = parseFloat(a.successfulPercent) || 0;
			var bSucc = parseFloat(b.successfulPercent) || 0;
			return bSucc - aSucc;
		});
		return data;
	}

	function GetPercent(num, total) {
		/// <summary>
		/// 求百分比
		/// </summary>
		/// <param name="num">当前数</param>
		/// <param name="total">总数</param>
		num = parseFloat(num);
		total = parseFloat(total);
		if (isNaN(num) || isNaN(total)) {
			return "-";
		}
		return total <= 0 ? "0%" : (Math.round(num / total * 10000) / 100.00) + "%";
	}





	//渲染实时监控图
	function echarts_init() {
		const date1 = new Date()
		date1.setMinutes(date1.getMinutes() - 1440)
		const date2 = new Date()
		$.ajax({
			type: 'post',
			url: url + "admin/getActive",
			dataType: 'json',
			async: true,
			headers: {
				access_token:layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["access_token"]
			},
			data: {
				project_id: $("#project_active").val(),
				startTime: timestamp + " 00:00:00",
				endTime: formatDateToString(date2)
			},
			success: function (res) {
				// 清除图表自适应监听
				echartsMapData.forEach(echartsMapItem => {
					echartsMapItem.resizeObserver && echartsMapItem.resizeObserver.disconnect()
				})
				const allMonitorData = formDataAllMonitorData(res.data)

				echartsMapData = initEchartsMap(allMonitorData)
				const appDom = echartsMapData.reduce((acc, curr) => acc + `<div id="${curr.domId}" style="width: 50%; height: 350px;"></div>`, '')
				$(".wrap").append(appDom);
				const nowTime = new Date().getTime();
				echartsMapData.forEach((item) => {
					item.data.forEach(lineItem => {
						!lineItem.data && (lineItem.data = [])
						const lineLastTime = lineItem.data[lineItem.data.length - 1][0]
						if (nowTime - lineLastTime > 30000 || lineItem.data.length === 0) {
							lineItem.data.push([nowTime, 0])
						}
					})
					initEcharts(item)
				})
				realTimeRendering()
			}
		});
		active5();


	}


	//实时渲染赛数据
	function realTimeRendering() {
		if (intervalControlAllData) {
			clearInterval(intervalControlAllData)
		}
		let allMonitorData;
		intervalControlAllData = setInterval(async () => {
			$.ajax({
				type: 'post',
				url: url + "admin/getNewActive",
				dataType: 'json',
				async: false,
				headers: {
					access_token: layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["access_token"]
				},
				data: {
					project_id: $("#project_active").val()
				},
				success: function (res) {

					allMonitorData = formDataAllMonitorData(res.data)
				}
			});

			if (active6IsHaveData == 0) {
				table.reload('LAY-user-manage-active6', {
					where: { project_id: $("#project_active").val() }
				});
			} else {
				$(".layui-icon-refresh").click();
			}


			// 数据处理----------------------------------------

			echartsMapData.forEach(echartsMapDataItem => {
				echartsMapDataItem.data.forEach(gateItem => {
					let nowDateFromDB = new Date().getTime();
					if (!echartsMapDataItem.domId) {
						return;
					}
					const findGateWay = allMonitorData[echartsMapDataItem["domId"]].find((allMonitorDataItem) => {
						allMonitorDataItem.data && (nowDateFromDB = allMonitorDataItem.data[0][0] || nowDateFromDB)
						return allMonitorDataItem.gateway_id === gateItem.gateway_id && allMonitorDataItem.gatewayName === gateItem.gatewayName
					})
					if (findGateWay) {
						gateItem.data.push(...findGateWay.data)
					} else {
						gateItem.data.push([nowDateFromDB, 0])
					}

				})
			})
			// 数据渲染------------------------------------------
			echartsMapData.forEach(item => {
				item.dom.setOption({
					series: item.data
				})
			})
		}, 10000)
	}


	// 渲染单表
	function initEcharts(echartsMapItem) {
		const echartsDom = document.getElementById(echartsMapItem.domId)
		echartsMapItem.dom = echarts2.init(echartsDom)
		echartsMapItem.resizeObserver = new ResizeObserver(() => {
			echartsMapItem.dom.resize()
		})
		echartsMapItem.resizeObserver.observe(echartsDom)

		const now = new Date()
		const startOfDay = new Date()
		startOfDay.setHours(0, 0, 0, 0)
		const timeDiff = now - startOfDay
		const minutesDiff = Math.floor(timeDiff / 1000 / 60)
		const dataZoomRate = 100 - (30 / minutesDiff) * 100
		const option = {
			title: {
				text: echartsMapItem.title,
				left: 'center'
			},
			grid: {
				left: 50,
				right: 40
			},
			tooltip: {
				trigger: 'axis',
				axisPointer: {
					animation: false
				}
			},
			dataZoom: [
				{
					type: 'inside',
					start: dataZoomRate,
					end: 100
				},
				{
					start: 0,
					end: 100
				}
			],
			legend: {
				data: echartsMapItem.data.map((item) => item.name),
				top: '28px',
				type: 'scroll',
				pageButtonPosition: 'inside',
				textStyle: {
					fontSize: 12
				}
			},
			xAxis: {
				type: 'time',
				splitLine: {
					show: true
				},
				axisLabel: {
					rotate: 15,
					formatter: function (value) {
						return `${new Date(value).toLocaleString().split(' ')[1]}`
					}
				}
			},
			yAxis: {
				type: 'value',
				boundaryGap: [0, '100%'],
				splitLine: {
					show: true
				}
			},
			series: echartsMapItem.data
		}
		echartsMapItem.dom.setOption(option, true)
	}


	// 格式化后端数据 表包裹线
	function formDataAllMonitorData(allMonitorData) {
		return allMonitorData.reduce((acc, curr) => {
			for (const key in curr.statNewVOS) {
				if (acc[key]) {
					acc[key].push({
						gateway_id: curr.gateway_id,
						gatewayName: curr.gatewayName,
						gatewayUserName: curr.gatewayUserName,
						data: curr.statNewVOS[key]
					})
				} else {
					acc[key] = [
						{
							gateway_id: curr.gateway_id,
							gatewayName: curr.gatewayName,
							gatewayUserName: curr.gatewayUserName,
							data: curr.statNewVOS[key]
						}
					]
				}
			}
			return acc
		}, {})
	}

	// 初始化折线表折线映射数据
	function initEchartsMap(allMonitorData) {
		const echartsMapData = Object.entries(allMonitorData).map(([key, value]) => {
			return { name: key, data: value }
		})
		return echartsMapData.map((item) => {
			return {
				dom: null,
				domId: item.name,
				title: echartsTitleMap[item.name],
				data: item.data.map((itemData, index) => {
					let name = itemData.gatewayName
					if (
						itemData.gatewayName === '总数' &&
						(item.name === 'callList' || item.name === 'transferList')
					) {
						name = '总占比'
					} else {
						name = itemData.gatewayUserName
							? `${itemData.gatewayUserName}(${itemData.gatewayName})`
							: itemData.gatewayName
						name = name ?? itemData.gateway_id
					}
					return {
						name: String(name ?? ''),
						gatewayName: itemData.gatewayName ?? '',
						gateway_id: itemData.gateway_id ?? '',
						type: 'line',
						showSymbol: false,
						data: itemData.data ?? [[new Date().getTime(), 0]],
						lineStyle: {
							color: colors[index % 5]
						}
					}
				})
			}
		})
	}

	function claerAllDomAndInterval() {
		// 清除数据监控定时器
		if (intervalControlAllData) {
			clearInterval(intervalControlAllData)
		}
		echartsMapData.forEach((item) => {
			if (item.dom) {
				item.dom.clear()
				item.dom.dispose()
				item.dom = null
			}
		})
	}


	function formatDateToString(date) {
		const dateDay = date.toLocaleString().split(' ')[0]
		const datetime = date.toLocaleString().split(' ')[1]
		const dateDayMap = dateDay.split('/')
		dateDayMap[1] = dateDayMap[1].toString().padStart(2, '0')
		dateDayMap[2] = dateDayMap[2].toString().padStart(2, '0')
		return dateDayMap.join('-') + ' ' + datetime
	}
