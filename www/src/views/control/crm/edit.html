<div class="layui-form" lay-filter="layuiadmin-form-crm_edit" style="padding: 20px 0 0 0;">

	<div class="layui-form-item">
		<label class="layui-form-label">名称:</label>
		<div class="layui-input-inline">
			<input type="text" name="name" lay-verify="required" readonly="readonly" autocomplete="off" placeholder="请输入名称" class="layui-input">
		</div>
	</div>

	<div class="layui-form-item">
		<label class="layui-form-label">问卷跳转:</label>
		<div class="layui-input-inline">
			<select name="enable_issue" lay-filter="" style="width: 50px;">
				<option value="1">启用</option>
				<option value="0">禁用</option>

			</select>
		</div>
	</div>

	<div class="layui-form-item">
		<label class="layui-form-label">挂机短信时长:</label>
		<div class="layui-input-inline">
			<input type="text" name="gt_duration" lay-verify="required|number" autocomplete="off" value="0" placeholder="请输入" class="layui-input">
		</div>
		<div class="layui-form-mid layui-word-aux">
			<p>1. 0代表坐席手动发送</p>
			<p>2. 1或以上，代表接通了多少秒自动发送</p>
			<p>3. -1代表每一通呼叫都发送</p>
		</div>

	</div>

	<div class="layui-form-item layui-form-text">
		<label class="layui-form-label">挂机短信内容:</label>
		<div class="layui-input-block">
			<textarea placeholder="请输入内容" id="sms_content" name="sms_content" class="layui-textarea" style="width: 350px;"></textarea>
		</div>
	</div>

	<div class="layui-form-item">
		<label class="layui-form-label"></label>
		<div class="layui-input-inline">
			<input type="button" id="crm_edit" lay-submit lay-filter="LAY-user-front-crm_edit-submit" value="提交" class="layui-btn">
		</div>
	</div>
</div>
