<!DOCTYPE html>

<html>

<head>

	<meta charset="UTF-8">

	<title></title>

</head>

<body>

	<div class="layui-fluid">

		<div class="layui-card">

			<div class="layui-form layui-card-header layuiadmin-card-header-auto"
				lay-filter="layadmin-userfront-formlist-project-task">

				<div class="layui-form-item">

					<div class="layui-inline" id="protect_task_p">

						<label class="layui-form-label">项目名称</label>

						<div class="layui-input-inline">

							<select id="project_ids" name="project_id">

							</select>

						</div>

					</div>
					<div class="layui-inline">

						<label class="layui-form-label">执行状态</label>

						<div class="layui-input-inline">

							<select id="status" name="status">
								<option value="-1">全部</option>
								<option value="1">运行中</option>
								<option value="0">已停止</option>


							</select>

						</div>

					</div>

					<div class="layui-inline">

						<label class="layui-form-label">任务名称</label>

						<div class="layui-input-inline">

							<input type="text" name="name" placeholder="请输入" autocomplete="off" class="layui-input">

						</div>

					</div>



					<div class="layui-btn-group" style="float: right;">

						<button class="layui-btn layuiadmin-btn-useradmin" title="查询" id="user_task_search" lay-submit
							lay-filter="LAY-user-front-search-project-task">

							<i class="layui-icon layui-icon-search layuiadmin-button-btn"></i>查询

						</button>

						<button class="layui-btn layuiadmin-btn-primary layuiadmin-btn-useradmin" title="增加"
							data-type="add"> <i class="layui-icon layui-icon-add-1 layuiadmin-button-btn"></i></button>

						<button class="layui-btn layuiadmin-btn-primary layuiadmin-btn-useradmin layui-btn-danger"
							title="删除" data-type="batchdel"> <i
								class="layui-icon layui-icon-delete layuiadmin-button-btn"></i></button>


					</div>

				</div>

			</div>

			<div class="layui-card-body">

				<table id="LAY-user-manage-project-task" lay-filter="LAY-user-manage-project-task"></table>



			</div>

		</div>

	</div>

</body>
<style>
	.layui-form-label {
		width: 100px;
	}

	/* .layui-layer-content {
		overflow: visible !important;
	} */
</style>

<script>
	var $;
	var admin_name = "";
	layui.use(['admin', 'table', 'upload', 'xmSelect', 'laydate'], function () {

		var table = layui.table;

		form = layui.form;

		$ = layui.$;

		view = layui.view;

		admin = layui.admin;

		upload = layui.upload;

		element = layui.element;
		xmSelect = layui.xmSelect;
		laydate = layui.laydate;


		$(function () {
			admin.req({
				url: layui.setter.configUrl + 'menu/info',
				async: false,
				done: function (res) {
					admin_name = res.data.name;


				}
			})



			if (layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["role"] != "super_admin") {

				admin.req({ //执行项目下拉列表

					type: "POST",

					url: layui.setter.configUrl + "admin/project/list",

					dataType: 'json',

					success: function (res) {

						var result = res.data;
						$("#project_ids").append("<option value='0'>--请选择--</option>");
						for (var i = 0; i < result.length; i++) {

							$("#project_ids").append("<option value=" + result[i].id + ">" +
								result[i].name + "</option>");

						}

						layui.form.render("select");

						//}

					}

				});

			}

		})


		var timeInfo = [];
		var timeInfoId = {};
		admin.req({
			type: "POST",
			url: layui.setter.configUrl +
				'admin/schedule/getInfo',
			async: false,
			dataType: "json",
			success: function (obj) {
				timeInfo = obj.data;
				for (let i = 0; i < timeInfo.length; i++) {
					const element = timeInfo[i];
					timeInfoId[element.id] = element;

				}
			}
		});




		table.render({

			method: 'POST',

			elem: '#LAY-user-manage-project-task',

			url: layui.setter.configUrl + 'admin/project_task/grid',

			height: 'full-180',
			where: {
				project_id: 0,
				name: '',
				status: "-1"
			},
			// parseData: function(res) { //表格数据前置处理
			// 	//对结果进行排序
			// 	function  sortId(a,  b)  {                    
			// 		return  b.id  -  a.id;

			// 	}
			// 	var result = res.data.sort(sortId); //按id最大排序
			// 	return {
			// 		"code": res.code, //解析接口状态
			// 		"msg": res.msg, //解析提示文本
			// 		"count": res.data.length, //解析数据长度
			// 		"data": result //解析数据列表
			// 	}
			// },
			cols: [

				[{

					type: 'checkbox'

				}, {

					field: 'name',

					title: '任务名称',
					edit: true,
					align: 'center',

					minWidth: 350

				},
				// {
				// 	field: 'outboundType',
				// 	title: '外呼类型',
				// 	sort: true,
				// 	align: 'center',
				// 	templet: function (d) {
				// 		if (d.outboundType == 1)
				// 			return "预测外呼";
				// 		else if (d.outboundType == 2)
				// 			return "比例外呼";
				// 		else if (d.outboundType == 3)
				// 			return "自动外呼";
				// 		else if (d.outboundType == 4)
				// 			return "点击外呼";
				// 		else if (d.outboundType == 5)
				// 			return "预览外呼";
				// 	},
				// 	minWidth: 130
				// },
				{

					field: 'projectName',

					title: '执行项目',

					align: 'center',

					minWidth: 250,
					templet: function (d) {
						if (d.outboundType == 1)
							return d.projectName + "(预测外呼)";
						else if (d.outboundType == 2)
							return d.projectName + "(比例外呼)";
						else if (d.outboundType == 3)
							return d.projectName + "(自动外呼)";
						else if (d.outboundType == 4)
							return d.projectName + "(点击外呼)";
						else if (d.outboundType == 5)
							return d.projectName + "(预览外呼)";

					}

				}, {

					field: 'create_stamp',

					title: '创建时间',

					align: 'center',

					minWidth: 180

				}, {

					field: 'noCall_count',

					title: '进度',

					sort: true,

					align: 'center',

					minWidth: 180,

					templet: function (d) {

						return '<div class="layui-progress" lay-showpercent="true" title="未呼条数(' +
							d.noCalls +
							')条" style="margin-top:15px;background-color:red;"><div class="layui-progress-bar"  lay-percent="' +
							d.noCalls + ' / ' + d.total + '"></div></div>';

					}

				}, {

					field: 'status',

					title: '执行状态',

					align: 'center',

					sort: true,

					minWidth: 100,

					templet: function (d) {

						if (d.status == 0) {

							//return '<a href="#" style="color:red">已停止</a>';

							return '<a class="layui-btn layui-btn-xs layui-btn-danger" title="点击执行该项目" onclick="project_task_tool.editStatus(' +
								d.id + ',1);">已停止</a>'

						} if (d.status == 2) {

							//return '<a href="#" style="color:red">已停止</a>';

							return '<a class="layui-btn layui-btn-xs" title="点击执行该项目">处理中</a>'

						} else {

							//return '<a href="#" style="color:green">正在执行</a>';

							return '<a class="layui-btn layui-btn-xs" title="点击停止该项目" onclick="project_task_tool.editStatus(' +
								d.id + ',0);">正在执行</a>'

						}

					},

				}, {

					field: 'caozuo',

					title: '操作',

					align: 'center',
					fixed: 'right',
					minWidth: 300,

					templet: function (d) {

						var result = "";

						result = result +
							'<img style="cursor:pointer;margin-left:16px;" title="导入数据" onclick="project_task_tool.import(' +
							d.id + ',' + d.project_id +
							')" src="../start/images/data_add.png">';

						result = result +
							'<img style="cursor:pointer;margin-left:16px;" title="快速导入" onclick="project_task_tool.quick_import(' +
							d.id + ',' + d.project_id +
							')" src="../start/images/quick_import.png">';



						result = result +
							'<img style="cursor:pointer;margin-left:16px;" title="清空未呼数据" onclick="project_task_tool.clear(' +
							d.id + ',' + d.project_id +
							')" src="../start/images/data_clear.png">';

						result = result +
							'<img style="cursor:pointer;margin-left:16px;" title="回收未接数据" onclick="project_task_tool.recovery(' +
							d.id + ',' + d.project_id + ')" src="../start/images/data_recovery.png">';

						result = result +
							'<img style="cursor:pointer;margin-left:16px;" title="定时器" lay-event="onTimeClose" src="../start/images/timer.png">';
						result = result +
							'<img style="cursor:pointer;margin-left:16px;" title="时间线" lay-event="time_line" src="../start/images/time_line.png">';
						result = result +
							'<img style="cursor:pointer;margin-left:16px;" title="实时监控" onclick="project_task_tool.open(' +
							d.project_id + ');" src="../start/images/monitor.png">';

						return result;

					}

				}
				]

			],

			done: function (obj) {

				if (location.hash == '#/control/project_task') {

					layer.tips("执行和停止任务点我哦~", ".layui-table-header th:eq(5)", {

						tips: [1, '#78BA32'],

						time: 2000

					});

				}

				element.render();

			},

			page: true

		});

		form.render(null, 'layadmin-userfront-formlist-project-task');

		//监听搜索

		form.on('submit(LAY-user-front-search-project-task)', function (data) {

			var field = data.field;

			//执行重载

			table.reload('LAY-user-manage-project-task', {

				where: field,

				page: {

					curr: 1

				}

			});

		});

		table.on('sort(LAY-user-manage-project-task)', function (obj) {
			table.reload('LAY-user-manage-project-task', {
				initSort: obj
			});
		});
		//监听单元格编辑
		table.on('edit(LAY-user-manage-project-task)', function (obj) {
			var value = obj.value //得到修改后的值
				,
				data = obj.data //得到所在行所有键值
				,
				field = obj.field; //得到字段
			if (field == "name") {
				//alert(value);
				if (value != "") {
					admin.req({
						type: "POST",
						url: layui.setter.configUrl + "admin/project_task/editName",
						//async: true,
						data: {
							id: data.id,
							name: value
						},
						dataType: "json",
						success: function (obj) {
							if (obj.data > 0) {
								layer.msg("任务名称修改成功", {
									icon: 1
								});
							} else {
								layer.msg("修改失败,请重试", {
									icon: 2
								});
							}
						}
					});
				} else {
					layer.msg("修改失败,名称不能为空", {
						icon: 2
					});
				}
			}
		})

		//监听行工具栏
		table.on('tool(LAY-user-manage-project-task)', function (obj) {
			var data = obj.data, //获得当前行的数据
				layEvent = obj.event; //获得lay-event对应的值
			if (layEvent === 'onTimeClose') {
				admin.popupRight({
					title: '任务定时计划',
					area: '600px',
					id: 'LAY-popup-user-timer',
					success: function (layero, index) {
						view(this.id).render('control/project_task/timer').done(function () {
							form.render(null, 'layuiadmin-form-project_task_timer');
							let weekDays = [];
							if (data.timer != null && data.timer != "{}") {
								weekDays = JSON.parse(data.timer).weekDays;
								let task_time_data = JSON.parse(data.timer).slots;
								for (let i = 0; i < task_time_data.length; i++) {
									addnode(1, task_time_data[i].start + " - " + task_time_data[i].end);
								}
							}
							days(weekDays);

							form.on('submit(LAY-user-front-project_task-timer-submit)',
								function (datas) {
									var field = datas.field; //获取提交的字段

									var reqTimer = [];
									$('#nodes').children().each(function (i, n) {
										var obj = $(n).find('input');
										if ($(obj[0]).val() != "") {
											var teach = {};
											teach.start = $(obj[0]).val().split(" - ")[0].substring(0, 5);
											teach.end = $(obj[0]).val().split(" - ")[1].substring(0, 5);
											reqTimer.push(teach);
										}
									});
									if (reqTimer.length == 0) {
										layer.msg("请添加时段", { icon: 2 });
										return;
									}
									if (reqTimer.length > 4) {
										layer.msg("最多选择四个呼叫时段", { icon: 2 });
										return;
									}



									let timer = {};
									timer.slots = reqTimer;
									timer.weekDays = field.weekDays.split(",");
									layer.load();
									admin.req({
										type: "POST",
										url: layui.setter.configUrl +
											'admin/project_task/editTimer',
										//async: true,
										data: {
											id: data.id,
											timer: JSON.stringify(timer)
										},
										dataType: "json",
										success: function (obj) {
											layer.closeAll('loading');
											if (obj.data > 0) {
												layer.msg("设置成功", {
													icon: 1
												});
												layui.table.reload(
													'LAY-user-manage-project-task'
												); //重载表格
												layer.close(index);
											} else {
												layer.msg("操作失败,请重试", {
													icon: 2
												});
											}
										}
									});
								});
						});

					}

				});
			} else if (layEvent === 'time_line') {

				let time_line = JSON.parse(data.time_line);
				time_line = time_line.reverse();
				admin.popupRight({
					title: '时间线',
					area: '500px',
					id: 'LAY-popup-user-time_line',
					success: function (layero, index) {
						view(this.id).render('control/project_task/time_line').done(function () {
							form.render(null, 'layuiadmin-form-project_task_timeLineLogs');
							$("#timeLineLogs").empty();

							for (var i = 0; i < time_line.length; i++) {
								let result = JSON.parse(time_line[i]);
								$("#timeLineLogs").append('<li class="layui-timeline-item"><i class="layui-icon layui-timeline-axis"></i>' +
									'<div class="layui-timeline-content layui-text">' +
									'<h3 class="layui-timeline-title">' + result.time + '</h3>' +
									'<p>' + result.msg + '</p>' +
									'</div>' +
									'</li>');
							}
							$("#timeLineLogs").append('<li class="layui-timeline-item">' +
								'<i class="layui-icon layui-timeline-axis"></i>' +
								'<div class="layui-timeline-content layui-text">' +
								'<div class="layui-timeline-title">没有更多啦</div>' +
								'</div>' +
								'</li>');





						})
					}
				})

			} else if (layEvent === 'editBotId') {
				admin.popup({

					title: '更改AI机器人',

					//area: ['40%', '45%'],

					area: ['600px', '300px'],

					id: 'LAY-popup-user-editBot',
					resize: false,

					btn: ['提交', '取消'],

					success: function (layero, index) {

						view(this.id).render('control/project_task/editBotId').done(function () {

							form.render(null, 'layuiadmin-form-project_task_editBot');

							var bot_id = "";
							if (data.remark != "" && data.remark != null) {
								bot_id = JSON.parse(data.remark).bot_id;
							}
							editBotSelect(bot_id);



							//监听提交

							form.on('submit(LAY-user-front-project_task-editBot-submit)',
								function (datas) {

									var field = datas.field; //获取提交的字段

									var bot_id = field.bot_id == "" ? null : field.bot_id;

									layer.load();

									admin.req({

										type: "POST",

										url: layui.setter.configUrl +
											'admin/project_task/editBot',

										//async: true,

										data: {
											id: data.id,
											bot_id: bot_id
										},

										dataType: "json",

										success: function (obj) {

											layer.closeAll(
												'loading');

											if (obj.data > 0) {

												layer.msg("操作成功", {
													icon: 1
												});

												layui.table.reload(
													'LAY-user-manage-project-task'
												); //重载表格

												layer.close(
													index); //执行关闭 

											} else {

												layer.msg("操作失败", {
													icon: 2
												});

											}

										}

									});



								});

						});

					},

					yes: function (index, layero) {

						layero.find('#project_task_editBot').click();

					}

				});
			}
		})

		//事件

		var active = {
			batchdel: function () {

				var checkStatus = table.checkStatus('LAY-user-manage-project-task'),

					checkData = checkStatus.data; //得到选中的数据

				var ids = "";
				for (var i = 0; i < checkData.length; i++) {
					if (ids != "") {
						ids = ids + "," + checkData[i].id;
					} else
						ids = checkData[i].id;
				}
				if (checkData.length === 0) {
					return layer.msg('请选择数据', {
						icon: 2
					});
				}
				layer.confirm('确定删除吗？', {

					icon: 3

				}, function (index) {
					//执行 Ajax 后重载
					layer.load();
					admin.req({
						type: "post",
						url: layui.setter.configUrl + 'admin/project_task/remove',
						dataType: "json",
						data: {
							ids: ids,
							project_id: checkData.project_id
						},
						success: function (obj) {

							layer.closeAll('loading');

							if (obj.data > 0) {

								layer.msg("已删除", {
									icon: 1
								});

								table.reload('LAY-user-manage-project-task');

							} else {

								layer.msg("删除失败,请重试", {
									icon: 2
								});

							}

						}

					});


				});

			},

			add: function () {

				admin.popup({

					title: '新建任务',

					//area: ['40%', '45%'],

					area: ['650px', '400px'],

					id: 'LAY-popup-user-add',
					resize: false,

					btn: ['提交', '取消'],

					success: function (layero, index) {

						view(this.id).render('control/project_task/add').done(function () {

							form.render(null, 'layuiadmin-form-project_task_add');

							//$("#timer").emtpty();
							$("#timer").append('<option value="">请选择定时器</option>')
							for (let i = 0; i < timeInfo.length; i++) {
								const element = timeInfo[i];
								$("#timer").append('<option value=' + element.id + '>' + element.task_desc + '</option>')

							}

							//监听提交

							form.on('submit(LAY-user-front-project_task-submit)',
								function (data) {

									var field = data.field; //获取提交的字段

									if (field.project_id == 0) {

										layer.msg("请选择执行项目", {
											icon: 2
										});

										return;

									}

									if ($("#existnames").html() == "任务名称已存在") {

										layer.msg("任务名称重复,请换一个试试", {
											icon: 2
										});

									} else {
										let timer = {};
										if (field.timer != "") {
											timer.slots = JSON.parse(timeInfoId[field.timer].task_time);
											timer.weekDays = resetTaskWeek(timeInfoId[field.timer].task_week);
										}
										field.timer = JSON.stringify(timer);
										layer.load();

										admin.req({

											type: "POST",

											url: layui.setter.configUrl +
												'admin/project_task/add',

											//async: true,

											data: field,

											dataType: "json",

											success: function (obj) {

												layer.closeAll(
													'loading');

												if (obj.data > 0) {

													layer.msg("操作成功", {
														icon: 1
													});

													layui.table.reload(
														'LAY-user-manage-project-task'
													); //重载表格

													layer.close(
														index); //执行关闭 

												} else {

													layer.msg("操作失败", {
														icon: 2
													});

												}

											}

										});

									}

								});

						});

					},

					yes: function (index, layero) {

						layero.find('#project_task_add').click();

					}

				});

			}

		};

		$('.layui-btn.layuiadmin-btn-useradmin').on('click', function () {

			var type = $(this).data('type');

			active[type] ? active[type].call(this) : '';

		});

	});

	var down_project_id; //点击导入按钮获取当前行project_id;

	project_task_tool = {

		editStatus: function (id, status) { //1-开启 ，0-关闭

										id: id,
										timer: JSON.stringify(req)
									},
									dataType: "json",
									success: function (obj) {
										layer.closeAll('loading');
										if (obj.data > 0) {
											layer.msg("设置成功", {
												icon: 1
											});
											layui.table.reload(
												'LAY-user-manage-project-task'
											); //重载表格
											layer.close();
										} else {
											layer.msg("操作失败,请重试", {
												icon: 2
											});
										}
									}
								});
							});
					});

				}

			});
		},
		open: function (id) {

			window.open("../start/monitor.html?id=" + id);

		}

	}

	function filterRepeatStr(str) {
		var ar2 = str.split(",");
		var array = new Array();
		var j = 0
		for (var i = 0; i < ar2.length; i++) {
			if ((array == "" || array.toString().match(new RegExp(ar2[i], "g")) == null) && ar2[i] != "") {
				array[j] = ar2[i];
				array.sort();
				j++;
			}
		}
		return array.toString();
	}
	function resetTaskWeek(task_week) {
		return task_week.split(',').map(item => {
			return String(((Number(item) + 1) % 7) || 7)
		})
	}
</script>
