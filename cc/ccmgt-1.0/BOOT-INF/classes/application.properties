spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.pool-name=hikari-pool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=1024
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=select 1
spring.datasource.hikari.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.jdbc-url=jdbc:mysql://127.0.0.1/cc?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC&useSSL=false&allowMultiQueries=true&allowPublicKeyRetrieval=true
#logging.level.cn.psycall.trans.mapper=debug
spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=300MB
logging.level.org.freeswitch.esl=error