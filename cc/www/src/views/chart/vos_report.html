<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>落地大盘分析</title>
  </head>
  <body>
    <div class="layui-fluid">
      <div class="layui-card">
        <div
          class="layui-form layui-card-header layuiadmin-card-header-auto"
          lay-filter="report-form"
        >
          <div class="layui-form-item">
            <div class="layui-inline">
              <div class="layui-input-inline" style="width: 150px">
                <select id="admin_id_select" name="admin_id" lay-filter="admin_id_select">
                  <option value="0" selected>全部机构</option>
                  <option value="1">青年宫</option>
                  <option value="6">合并账户</option>
                  <option value="7">金港偃师</option>
                </select>
              </div>
            </div>

            <div class="layui-inline">
              <div class="layui-input-inline" style="width: 100px">
                <select id="timezidingyi" lay-filter="timezidingyi">
                  <option value="今天" selected>今天</option>
                  <option value="昨天">昨天</option>
                  <option value="前天">前天</option>
                  <option value="大前天">大前天</option>
                  <option value="自定义">自定义</option>
                </select>
              </div>
            </div>

            <div class="layui-inline" id="ID-startend-datetime" style="margin-left: -20px">
              <div class="layui-input-inline" style="width: 220px">
                <input
                  type="text"
                  class="layui-input"
                  id="newDateStamp"
                  placeholder=" ~ "
                  autocomplete="off"
                />
              </div>
            </div>

            <div class="layui-btn-group" style="float: right">
              <button
                class="layui-btn layuiadmin-btn-useradmin"
                lay-submit
                lay-filter="search-report"
              >
                <i class="layui-icon layui-icon-search layuiadmin-button-btn"></i>查询
              </button>
            </div>
          </div>
        </div>

        <div class="layui-card-body">
          <table id="LAY-report-total" lay-filter="LAY-report-total"></table>
        </div>
      </div>
    </div>

    <script>
      layui.use(["admin", "table", "form", "laydate"], function () {
        var table = layui.table;
        var form = layui.form;
        var laydate = layui.laydate;
        var $ = layui.$;

        // 初始化渲染表单容器
        form.render(null, "report-form");

        function getDateStr(daysOffset) {
          var date = new Date();
          date.setDate(date.getDate() + daysOffset);
          return (
            date.getFullYear() +
            "-" +
            String(date.getMonth() + 1).padStart(2, "0") +
            "-" +
            String(date.getDate()).padStart(2, "0")
          );
        }

        function updateDateRange(type) {
          var start = "",
            end = "";
          // 👇 加上这三行，getDateStr(0) 就是今天
          if (type === "今天") {
            start = end = getDateStr(0);
          } else if (type === "昨天") {
            start = end = getDateStr(-1);
          } else if (type === "前天") {
            start = end = getDateStr(-2);
          } else if (type === "大前天") {
            start = end = getDateStr(-3);
          }
          return { start: start, end: end };
        }

        var defaultDates = updateDateRange("今天");
        var currentDateRange = defaultDates.start + " ~ " + defaultDates.end;

        laydate.render({
          elem: "#newDateStamp",
          range: "~",
          value: currentDateRange,
          done: function (value) {
            if (value && value !== currentDateRange) {
              $("#timezidingyi").val("自定义");
              form.render("select", "report-form");
              currentDateRange = value;
            }
          },
        });

        form.on("select(timezidingyi)", function (data) {
          if (data.value !== "自定义") {
            var dates = updateDateRange(data.value);
            currentDateRange = dates.start + " ~ " + dates.end;
            $("#newDateStamp").val(currentDateRange);
          }
        });

        // 默认初始化表格 (请求全局 total 接口)
        table.render({
          elem: "#LAY-report-total",
          url: "/api/report/vosTotal",
          method: "get",
          where: {
            startDate: defaultDates.start,
            endDate: defaultDates.end,
          },
          parseData: function (res) {
            return {
              code: res.code === 200 ? 0 : res.code,
              msg: res.message,
              count: res.data ? res.data.length : 0,
              data: res.data,
            };
          },
          cols: [
            [
              { field: "落地名称", title: "落地名称", align: "center", minWidth: 150, sort: true },
              { field: "总数", title: "总数", align: "center", sort: true },
              { field: "成功", title: "成功", align: "center", sort: true },
              { field: "话费(元)", title: "话费(元)", align: "center", sort: true },
              { field: "每单话费(元)", title: "每单话费(元)", align: "center", sort: true },
              { field: "时长(秒)", title: "时长(秒)", align: "center", sort: true },
              { field: "平均时长(秒)", title: "平均时长(秒)", align: "center", sort: true },
              { field: "短秒率", title: "短秒率(<3秒)", align: "center", sort: true },
            ],
          ],
          page: false,
          limit: 1000, // 👈 【新增这一行】强制全局容量为1000条
          autoSort: false,
          done: function (res, curr, count) {
            var that = this.elem.next();
            res.data.forEach(function (item, index) {
              if (item["落地名称"] === "合计") {
                var tr = that.find(".layui-table-box tbody tr[data-index='" + index + "']");
                tr.css({ "background-color": "#f0f9eb", "font-weight": "bold" });
              }
            });
          },
        });

        table.on("sort(LAY-report-total)", function (obj) {
          var tableData = table.cache["LAY-report-total"];
          var normalData = [];
          var totalRow = null;

          tableData.forEach(function (item) {
            if (item["落地名称"] === "合计") totalRow = item;
            else normalData.push(item);
          });

          if (obj.type) {
            normalData.sort(function (a, b) {
              var getNum = function (val) {
                var str = String(val);
                if (str.indexOf("(") !== -1 && str.indexOf("%") !== -1) {
                  var match = str.match(/\((.*?)\%\)/);
                  return match ? parseFloat(match[1]) : 0;
                }
                return parseFloat(str.replace(/[^0-9.-]/g, "")) || 0;
              };

              var numA = getNum(a[obj.field]);
              var numB = getNum(b[obj.field]);

              if (obj.type === "asc") return numA - numB;
              else return numB - numA;
            });
          }

          if (totalRow) normalData.push(totalRow);

          table.reload("LAY-report-total", {
            initSort: obj,
            url: "", // 👈 建议把 null 改为 ""（空字符串），防止某些旧版 Layui 依然偷偷发请求
            data: normalData,
            limit: normalData.length || 1000, // 👈 【新增这一行】无论排序后有多少条，全部强制展示出来！
          });
        });

        // ========== 核心逻辑：查询事件，动态切换接口与传参 ==========
        form.on("submit(search-report)", function (data) {
          var dateRange = $("#newDateStamp").val();
          if (!dateRange) {
            layer.msg("请选择日期范围");
            return;
          }

          var dates = dateRange.split(" ~ ");
          if (dates.length !== 2) {
            dates = dateRange.split(" - ");
          }

          // 1. 获取选中的机构 ID
          var selectedAdminId = $("#admin_id_select").val();

          // 2. 动态判断使用哪个接口
          var targetUrl =
            selectedAdminId === "0"
              ? "/api/report/vosTotal" // 选全部时，走全局大盘
              : "/api/report/vosTenant"; // 选具体机构时，走租户专属盘

          // 3. 组装参数
          var reqWhere = {
            startDate: layui.$.trim(dates[0]),
            endDate: layui.$.trim(dates[1]),
            adminId: selectedAdminId === "0" ? null : selectedAdminId, // Layui 会忽略传 null 的字段
          };

          // 4. 重载表格发请求
          table.reload("LAY-report-total", {
            url: targetUrl,
            data: null, // 清除本地排序缓存数据
            where: reqWhere,
          });
        });
      });
    </script>
  </body>
</html>
