<div class="layui-form" lay-filter="layuiadmin-form-focusUser-edit" style="padding: 20px;">


	<div class="layui-form-item">
		<label class="layui-form-label">工号</label>
		<div class="layui-input-block">
			<input type="text" id="jobNumber" name="jobNumber" readonly autocomplete="off"
				placeholder="请输入工号" class="layui-input">
				<div style="padding: 10px; border: 1px solid #91d5ff; background-color: #e6f7ff; margin-top: 4px; border-radius: 4px;">
					<img src="../../../../start/images/msg.png" /> 可更改微信绑定的坐席工号
				</div>
		</div>
	</div>

	<div class="layui-form-item">
		<label class="layui-form-label">允许推送</label>
		<div class="layui-input-block">
            <input type="radio" name="allow" value="1" title="允许" checked="">
            <input type="radio" name="allow" value="0" title="禁止">
          </div>
	</div>
    <div class="layui-form-item">
		<label class="layui-form-label">推送方式</label>
		<div class="layui-input-block">
            <input type="radio" name="pushType" value="1" title="轮询" checked="">
            <input type="radio" name="pushType" value="2" title="全推送">
          </div>
	</div>

    <div class="layui-form-item">
		<label class="layui-form-label">状态</label>
		<div class="layui-input-block">
            <input type="radio" name="status" lay-filter="status_fu" value="1" title="签入" checked="">
            <input type="radio" name="status" lay-filter="status_fu" value="2" title="签出">
            <input type="radio" name="status" lay-filter="status_fu" value="3" title="长签">
			<div style="padding: 10px; border: 1px solid #91d5ff; background-color: #e6f7ff; margin-top: 4px; border-radius: 4px;">
				<img src="../../../../start/images/msg.png" /> <span id="status_span_msg"></span> 
			</div>
          </div>
	</div>

    <div class="layui-form-item">
        <label class="layui-form-label">备注</label>
        <div class="layui-input-inline">
          <textarea placeholder="请输入内容" style="width: 400px;" name="remark" class="layui-textarea"></textarea>
        </div>
      </div>

	<div class="layui-form-item">
		<label class="layui-form-label"></label>
		<div class="layui-input-inline">
			<input type="button" id="LAY-user-focusUser-edit-submit" lay-submit lay-filter="LAY-focusUser-edit-front-submit" value="确认"
				class="layui-btn">
		</div>
	</div>

</div>
