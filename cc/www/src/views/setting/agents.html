<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title></title>
</head>

<body>
	<div class="layui-fluid">
		<div class="layui-card">
			<div class="layui-form layui-card-header layuiadmin-card-header-auto"
				lay-filter="layadmin-userfront-formlist-agents">
				<div class="layui-form-item">

					<div class="layui-inline">
						<label class="layui-form-label">用户</label>
						<div class="layui-input-block">
							<select name="admin_id" id="admin_id">
								<option value="0">--请选择--</option>

							</select>
						</div>
					</div>
					<div class="layui-inline">
						<label class="layui-form-label">工号</label>
						<div class="layui-input-block">
							<input type="text" name="extno" placeholder="请输入" autocomplete="off" class="layui-input">
						</div>
					</div>

					<div class="layui-btn-group" style="float: right;">
						<button class="layui-btn layuiadmin-btn-useradmin" title="查询" lay-submit
							lay-filter="LAY-user-front-search-agents">
							<i class="layui-icon layui-icon-search layuiadmin-button-btn"></i>查询
						</button>
						<button class="layui-btn layuiadmin-btn-primary layuiadmin-btn-useradmin" title="增加"
							data-type="add"> <i class="layui-icon layui-icon-add-1 layuiadmin-button-btn"></i></button>
						<button class="layui-btn layuiadmin-btn-primary layuiadmin-btn-useradmin layui-btn-danger"
							title="删除" data-type="batchdel"> <i
								class="layui-icon layui-icon-delete layuiadmin-button-btn"></i></button>
					</div>
				</div>
			</div>

			<div class="layui-card-body">
				<script type="text/html" id="barDemo">
					<a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="agent_info">注册信息</a>
				</script>

				<table id="LAY-user-manage-agents" lay-filter="LAY-user-manage-agents"></table>

			</div>
		</div>
	</div>

</body>
<style>
	.layui-layer-content {
		overflow: visible !important;
	}
</style>

<script>
	var jsonText = '' // 展示的数据
	layui.use(['admin', 'table'], function () {
		var table = layui.table;
		form = layui.form;
		var $ = layui.$;
		view = layui.view;
		admin = layui.admin;

		//form表单文本框验证规则
		form.verify({
			agentLength: function (value, item) { //value：表单的值、item：表单的DOM对象
				if (value > 125) {
					return "工号个数最大125个";
				}
				if (value <= 0) {
					return "工号个数必须大于0且小于125";
				}
			}
		})

		$(function () {
			admin.req({
				type: "POST",
				url: layui.setter.configUrl + "super_admin/admin/list",
				dataType: 'json',
				success: function (res) {
					var data = res.data;
					for (var i = 0; i < data.length; i++) {
						$("#admin_id").append("<option value=" + data[i].id + ">" + data[i]
							.name + "</option>");
					}
					layui.form.render("select");
				}
			});
		})

		table.render({
			method: "post",
			elem: '#LAY-user-manage-agents',
			url: layui.setter.configUrl + "super_admin/agent/grid",
			height: 'full-180',
			where: {
				admin_id: "0",
				extno: ""
			},
			cols: [
				[{
						type: 'checkbox'
					}, {
						field: 'name',
						title: '姓名',
						align: 'center'
					}, {
						field: 'extno',
						title: '工号',
						sort: true,
						align: 'center'
					}, {
						field: 'passwd',
						title: '密码',
						align: 'center',
						templet: function (d) {
							return unescape(d.passwd);
						}
					}, {
						field: 'sip_passwd',
						title: 'SIP密码',
						align: 'center',
						minWidth: 350,
						templet: function (d) {
							return d.sip_passwd +
								`&nbsp;&nbsp;<a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="copyVal" >复制</a>`;
						}
					}, {
						field: 'adminName',
						title: '用户',
						align: 'center',
						minWidth: 150,
					}, {
						//field: 'registered',
						title: '注册状态',
						sort: true,
						align: 'center',
						minWidth: 120,
						templet: function (d) {
							if (d.reg == null) {
								return '<span style="color: red;">未注册</span>';
							} else {

								return '<span style="color: green;">已注册</span>';
							}
						}
					}, {
						field: 'caozuo',
						title: '操作',
						toolbar: '#barDemo',
						fixed: 'right',
						align: 'center',
						minWidth: 173
					}

				]
			],

			page: true,
		});

		form.render(null, 'layadmin-userfront-formlist-agents');

		//监听搜索
		form.on('submit(LAY-user-front-search-agents)', function (data) {
			var field = data.field;

			//执行重载
			table.reload('LAY-user-manage-agents', {
				where: field,
				page: {
					curr: 1
				}
			});
		});

		form.verify({
			extension_verify: function (value, item) { //value：表单的值、item：表单的DOM对象
				if (/^[1-9]\d*(\d+)?$/.test(value) == false) { //大于0,不包含小数
					return "请填写大于0的数字";
				}

			},
			extension_pwd: function (value, item) { //验证密码强度
				var pwdRegex = /^(?![0-9]+$)(?![a-z]+$)(?![A-Z]+$)(?!([^(0-9a-zA-Z)])+$).{6,}$/;
				if (!pwdRegex.test(value)) {
					return "您的密码复杂度太低（密码中必须包含字母、数字、特殊字符的两种）";
				}

			},
			characters: function (value, item) {
				if (/[\u4E00-\u9FA5]/g.test(value)) {
					return "格式错误,请不要输入汉字";
				}

			},

		});

		//行监听工具
		table.on('tool(LAY-user-manage-agents)', function (obj) {
			var data = obj.data,
				layEvent = obj.event;
			if (layEvent === 'agent_info') {

				




				if (data.reg != null) {
					layer.load();

					layer.open({
						type: 1,
						title: "注册信息",
						//skin: 'layui-layer-rim', //加上边框
						area: ['550px', '550px'], //宽高
						shadeClose: true,
						//btn: ["重启", "关闭"],
						content: '<textarea style="height:100%;" placeholder="请输入内容" class="layui-textarea">' +
							clickFormat(JSON.stringify(data.reg)) + '</textarea>'
					});
					layer.closeAll('loading');
				} else {
					layer.msg("未注册", {
						icon: 2
					});
				}



			} else if (layEvent === 'copyVal') {
				const input = document.createElement('textarea');
				input.name = 'txtName';
				document.body.appendChild(input);
				input.setAttribute('id', 'aa');
				// input.setAttribute('value', '听说你想\n复制我');
				var i = document.getElementById('aa');
				i.innerHTML = data.sip_passwd;
				input.select();
				if (document.execCommand('copy')) {
					document.execCommand('copy');
					layer.msg("复制成功", {
						icon: 1
					});
				}
				document.body.removeChild(input);
			}
		})

		//事件
		var active = {
			batchdel: function () {
				var checkStatus = table.checkStatus('LAY-user-manage-agents'),
					checkData = checkStatus.data; //得到选中的数据
				var ids = "";
				var checklen = checkData.length;
				for (var i = 0; i < checkData.length; i++) {
					if (ids != "") {
						ids = ids + "," + checkData[i].id;
					} else
						ids = checkData[i].id;
				}

				if (checkData.length === 0) {
					return layer.msg('请选择数据', {
						icon: 2
					});
				}

				layer.confirm('确定删除吗？', {
					icon: 3
				}, function (index) {
					layer.load();
					//执行 Ajax 后重载

					admin.req({
						type: "POST",
						url: layui.setter.configUrl + "super_admin/agent/remove",
						//async: true,
						dataType: "json",
						data: {
							ids: ids
						},

						success: function (obj) {
							layer.closeAll('loading');
							if (obj.data > 0) {
								layer.msg("成功删除 " + checkData.length + " 条坐席", {
									icon: 1
								});
								table.reload('LAY-user-manage-agents');
							} else {
								layer.msg("删除失败,请重试", {
									icon: 2
								});
							}
						}
					});
				});
			},
			add: function () {
				admin.popupRight({
					title: '批量生成',
					area: '500px',
					id: 'LAY-popup-user-add',
					success: function (layero, index) {
						view(this.id).render('setting/agents/add').done(function () {
							form.render(null, 'layuiadmin-form-useradmin');

							//监听提交
							form.on('submit(LAY-user-front-submit)', function (data) {
								layer.load();
								var field = data.field; //获取提交的字段
								field.passwd = escape(field.passwd);
								if ($("#admin_ids").val() == 0) {
									layer.msg('工号信息不可修改,请选择用户', {
										icon: 2
									});
									return;
								} else {
									admin.req({
										type: "POST",
										url: layui.setter.configUrl +
											"super_admin/agent/add",
										data: field,
										dataType: "json",
										success: function (obj) {
											layer.closeAll(
												'loading');
											if (obj.msg ==
												'success') {
												layer.msg(
													"已批量生成 " +
													obj.data +
													" 条工号", {
														icon: 1
													});
												layui.table.reload(
													'LAY-user-manage-agents'
												); //重载表格
												layer.close(
													index); //执行关闭 
											}
											if (obj.msg ==
												'fail') {
												if (obj.data ==
													'-1') {
													layer.msg(
														"超出授权工号数", {
															icon: 2
														});
												} else if (obj
													.data == '-2'
												) {
													layer.msg(
														"区间工号已存在", {
															icon: 2
														});
												} else if (obj
													.data == '-3'
												) {
													layer.msg(
														"超出工号授权长度", {
															icon: 2
														});
												}

											}
											if (obj.data ==
												'-100') {
												layer.msg(obj
													.msg, {
														icon: 2,
														time: 6000
													});
											}
										}
									})
								}
							});
						});
					}
				});
				return false;
			}

		};

		$('.layui-btn.layuiadmin-btn-useradmin').on('click', function () {
			var type = $(this).data('type');
			active[type] ? active[type].call(this) : '';
		});

	});

	function clickFormat(bindMsg) {
		let jsonText = '' // 展示的数据
		let josnTimer = null
		if (bindMsg) {
			jsonText = JSON.stringify(JSON.parse(bindMsg), null, '\t')
		}
		jsonText = jsonText + '0'
		jsonText = jsonText.slice(0, -1)
		return jsonText;

	}
</script>

</html>
