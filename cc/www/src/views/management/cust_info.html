<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title></title>
</head>
<link type="text/css" rel="stylesheet" href="dist/droppicker.min.css">
<script src="js/jquery-3.6.0.min.js"></script>
<script src="dist/droppicker.min.js"></script>

<body>
	<div class="layui-fluid">
		<div class="layui-card">
			<div class="layui-form layui-card-header layuiadmin-card-header-auto"
				lay-filter="layadmin-userfront-formlist">
				<div class="layui-form-item" id="cust_info_form">
					<div class="layui-inline">
						<div class="layui-input-inline" style="width: 100px;">
							<select id="timezidingyi" name="timezidingyi" lay-filter="timezidingyi">
								<option value="1">1小时</option>
								<option value="6">6小时</option>
								<option value="今天">今天</option>
								<option value="上一天">上一天</option>
								<option value="上两天">上两天</option>
								<option value="上三天">上三天</option>
								<option value="自定义">自定义</option>
							</select>
						</div>
					</div>
					<div class="layui-inline" id="ID-startend-datetime" style="margin-left: -20px;">
						<div class="layui-input-inline" style="width: 350px;">
							<input type="text" class="layui-input" id="newDateStamp" placeholder=" ~ "
								autocomplete="off" />
						</div>
					</div>
					<div class="layui-inline">
						<div class="layui-input-inline">
							<select id="ci_status" name="status">
								<option value="0">已呼</option>
								<option value="1">未呼</option>

							</select>
						</div>
					</div>
					<div class="layui-inline" id="ci_project_dis">
						<div class="layui-input-inline">
							<select id="ci_project" name="project_id" lay-search="" lay-filter="ci_project_id_select">
							</select>
						</div>
					</div>
					<div class="layui-inline">
						<div class="layui-input-inline">
							<select id="ci_task" name="task_id" lay-search="" lay-filter="r_task_select">
								<option value="0">--任务--</option>
							</select>
						</div>
					</div>

					<div class="layui-inline">
						<div class="layui-input-inline">
							<select id="ci_seas" name="type">
								<option value="-1">--客户类型--</option>
								<option value="0">公海</option>
								<option value="1">私海</option>
							</select>
						</div>
					</div>
					<!-- <div class="layui-inline">
							<div class="layui-input-inline">
								<input type="text" name="startd" id="ci_start" placeholder="开始日期" autocomplete="off" class="layui-input">
							</div>
						</div>

						<div class="layui-inline">
							<div class="layui-input-inline">
								<input type="text" name="endd" id="ci_end" placeholder="结束日期" autocomplete="off" class="layui-input">
							</div>
						</div> -->
					<div class="layui-inline">
						<div class="layui-input-inline">
							<input type="text" id="ci_name" name="name" placeholder="客户姓名" autocomplete="off"
								class="layui-input">
						</div>
					</div>
					<div class="layui-inline">
						<div class="layui-input-inline">
							<input type="text" id="ci_telephone" name="telephone" placeholder="客户号码" autocomplete="off"
								class="layui-input">
						</div>
					</div>
					<div class="layui-inline" id="ci_extension_ids">
						<div class="layui-input-inline">
							<input type="text" id="ci_extension" name="extension" placeholder="坐席工号" autocomplete="off"
								class="layui-input">
						</div>
					</div>
					<div class="layui-inline" id="cust_info_senior">

					</div>
					<div class="layui-btn-group" style="float: right;">
						<button class="layui-btn layuiadmin-btn-useradmin" title="查询" id="cust_info_btn" lay-submit
							lay-filter="LAY-user-front-search-cust-info">
							<i class="layui-icon layui-icon-search layuiadmin-button-btn"></i>查询
						</button>

						<button class="layui-btn layuiadmin-btn-useradmin" id="cust_info_download"
							style="display: none;" onclick="cust_info_tool.download()">
							<i class="layui-icon layui-icon-upload-drag layuiadmin-button-btn"></i>导出信息
						</button>
						<button class="layui-btn layuiadmin-btn-useradmin" id="cust_info_conditionRemove"
							style="display: none;" onclick="cust_info_tool.conditionRemove()">
							<i class="layui-icon layui-icon-delete layuiadmin-button-btn"></i>删除数据
							<button class="layui-btn layuiadmin-btn-useradmin" id="cust_info_batch" data-type="batch"
								style="display: none;">
								<i class="layui-icon layui-icon-username layuiadmin-button-btn"></i>指定坐席
							</button>
					</div>
				</div>
			</div>

			<div class="layui-card-body">
				<div id="my_table">
					<table id="LAY-user-manage_info" lay-filter="LAY-user-manage_info"></table>
				</div>
				<!--<script type="text/html" id="toolbarDemo">
						<div class="layui-btn-container">
							{{# if(window.sessionStorage.getItem("role_names")!="agent"){ }}//此处的level为数据库中字段，d随便起的
							<button class="layui-btn layui-btn-sm" lay-event="batch">分配坐席</button> {{# } }}

						</div>
					</script>-->

				<!--<script type="text/html" id="table-useradmin-customer">
						<a href="javascript:;" style="color:dodgerblue;" lay-event="customer_for">{{ d.username }}</a>
					</script>-->
			</div>
		</div>
	</div>

</body>

<script src="/start/js/publicmethod.js"></script>
<script>
	var condit = [];//高级查询条件
	var search_list = [];//is_search=1的字段
	var address_url = "";
	var isRefresh = 0;
	layui.use(['admin', 'table', 'laydate', 'laypage', 'xmSelect'], function () {
		var table = layui.table;
		form = layui.form;
		var $ = layui.$;
		view = layui.view;
		admin = layui.admin;
		laydate = layui.laydate;
		laypage = layui.laypage;
		xmSelect = layui.xmSelect;

		if (window.location.protocol == "https:") {
			address_url = "https://addre.pscc.js.cn:8899/";
		} else {
			address_url = "http://addre.pscc.js.cn:8898/";
		}


		var date = new Date();
		let newEndTime = formatDateToString(date);
		date.setHours(date.getHours() - 1);
		let newStartTime = formatDateToString(date);
		let dateTimeChange = 0;
		form.on('select(timezidingyi)', function (data) {
			let val = data.value;
			newStartTime = getStartTime(val);
			newEndTime = getEndTime(val);

			laydate.render({
				elem: '#newDateStamp',
				type: 'datetime',
				value: newStartTime + " ~ " + newEndTime,
				range: "~",
			});
		})

		laydate.render({
			elem: '#newDateStamp',
			type: 'datetime',
			value: newStartTime + " ~ " + newEndTime,
			range: "~",
			change: function (value, date) { //日期被切换的回调
				//layer.msg("日期切换")
				dateTimeChange = 1;
			},
			done: function (value, date, endDate) {
				//layer.msg("日期确定")
				if (dateTimeChange == 1) {
					$("#timezidingyi").val("自定义");
					dateTimeChange = 0;
					form.render("select")
				}
			}
		});
		if (layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["role"] != "super_admin") {

			admin.req({ //项目下拉列表
				type: "POST",
				url: layui.setter.configUrl + "admin/project/list",
				dataType: 'json',
				success: function (res) {
					$("#ci_project").empty();
					var result = res.data;
					$("#ci_project").append("<option value='0'>--项目--</option>");
					for (var i = 0; i < result.length; i++) {
						$("#ci_project").append("<option value=" + result[i].id + ">" + result[i].name + "</option>");
					}
					layui.form.render("select");
				}
			});

			if (layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["allow_down"] == true) {
				$("#cust_info_download").css("display", "");
				$("#cust_info_batch").css("display", "");
				$("#cust_info_conditionRemove").css("display", "");
			}
			if (layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["permission"] == 4) {
				$("#ci_extension").val(window.sessionStorage.getItem("name"));
				$("#ci_extension_ids").css("display", "none");
				//$("#cust_info_btn").click();
			}
		}

		//获取表格的表头和表数据
		var data = []; //数据
		var title = []; //表头
		var info_eidt;

		table.render({
			method: 'POST',
			elem: '#LAY-user-manage_info',
			url: layui.setter.configUrl + "admin/customer_info/grid",
			height: 'full-220',
			toolbar: true,
			defaultToolbar: ['filter'],
			where: {
				project_id: 0,
				task_id: $("#ci_task").val(),
				status: $('#ci_status').val(),
				type: $('#ci_seas').val(),
				telephone: $('#ci_telephone').val(),
				extno: $('#ci_extension').val(),
				name: $('#ci_name').val(),
				startd: newStartTime,
				endd: newEndTime,
				conditions: []
			},
			cols: [
				[{
					field: 'name',
					title: '客户姓名',
					align: 'center',
					minWidth: 130
				}, {
					field: 'tel',
					title: '客户号码',
					align: 'center',
					minWidth: 130
				}, {
					field: 'status',
					title: '客户状态',
					align: 'center',
					minWidth: 130
				}]
			],
			page: true
		});
		form.render(null, 'layadmin-userfront-formlist'); //重载条件表单

		//监听搜索
		form.on('submit(LAY-user-front-search-cust-info)', function (data) {
			var field = data.field;
			if (field.project_id == "") {
				field.project_id = 0;
			}
			if (field.project_id == 0) {
				layer.msg("请选择项目", { icon: 2 })
				return;
			}
			//删除表格,再重置表格
			$("#my_table").empty();
			$("#my_table").append('<table id="LAY-user-manage_info" lay-filter="LAY-user-manage_info"></table>');

			title.length = 0; //表头


			let val = $("#timezidingyi").val();
			if (val != "自定义") {
				newStartTime = getStartTime(val);
				newEndTime = getEndTime(val);
				laydate.render({
					elem: '#newDateStamp',
					type: 'datetime',
					value: newStartTime + " ~ " + newEndTime,
					range: "~",
				});
			}
			field.start_stamp = $('#newDateStamp').val().split(" ~ ")[0];
			field.end_stamp = $('#newDateStamp').val().split(" ~ ")[1];
			//请求表格数据
			admin.req({
				type: 'POST',
				async: false,
				url: layui.setter.configUrl + "admin/crm_field/listProjectFields",

				data: {
					project_id: field.project_id
				},
				success: function (obj) {
					title.push({
						type: 'checkbox',
						fixed: 'left',
						title: '全选'
					});
					for (var i = 0; i < obj.data.length; i++) {
						if (obj.data[i].field_name == "客户状态") {
							continue;
						} else if (obj.data[i].field_name == "客户号码") {
							if (layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["role"] == "agent") {
								title.push({
									field: obj.data[i].field_name,
									title: obj.data[i].field_name,
									align: 'center',
									field_json: obj.data[i].field_json,
									input_type: obj.data[i].input_type,
									minWidth: 180,
									templet: function (d) {
										if (d.呼叫状态 == '0') {
											return '<a href="javascript:;" style="color: red;" title="点击拨号" onclick="cust_info_tool.infocall(' + "'" + d.uuid + "'" + ');"><img src="../start/images/info_call.png""/> ' + d.客户号码 + '</a>';
										} else {
											return '<a href="javascript:;" title="点击拨号" onclick="cust_info_tool.infocall(' + "'" + d.uuid + "'" + ');"><img src="../start/images/info_call.png""/> ' + d.客户号码 + '</a>';
										}

									}
								});
							} else {
								title.push({
									field: obj.data[i].field_name,
									title: obj.data[i].field_name,
									align: 'center',
									field_json: obj.data[i].field_json,
									input_type: obj.data[i].input_type,
									minWidth: 180,
									templet: function (d) {
										if (d.呼叫状态 == '0') {
											return '<span style="color: red;">' + d.客户号码 + '</span>';
										} else {
											return d.客户号码;
										}
									}
								});
							}
						} else {
							title.push({
								field: obj.data[i].field_name,
								title: obj.data[i].field_name,
								align: 'center',
								field_json: obj.data[i].field_json,
								input_type: obj.data[i].input_type,
								minWidth: 250,
							});
							continue;
						}
					}
					title.push({
						field: "坐席工号",
						title: "坐席工号",
						input_type: 1,
						align: 'center',
						minWidth: 100,
						fixed: 'right'
					});
					title.push({
						field: "录入日期",
						title: "录入日期",
						align: 'center',
						input_type: 1,
						minWidth: 200,
						fixed: 'right'
					});

					title.push({
						field: "呼叫状态",
						title: "呼叫状态",
						templet: function (d) {
							if (d.呼叫状态 == "0") {
								return "已呼";
							} else {
								return "未呼";
							}
						},
						align: 'center',
						minWidth: 100,
						field_json: "[{\"id\":\"0\",\"text\":\"已呼\"},{\"id\":\"1\",\"text\":\"未呼\"}]",
						input_type: 2,
						fixed: 'right'
					});
					info_eidt = title;

				}
			})

			//重新请求表格,table.reload加载过快,无法锁定重置后的table,故不使用

			condit = [];
			for (var key in field) {
				for (let i = 0; i < search_list.length; i++) {
					if (key == search_list[i].field_name) {
						if (field[key] != "")
							condit.push({ name: key, type: search_list[i].input_type, value: field[key] });
					}
				}
			}


			table.render({
				method: 'POST',
				elem: '#LAY-user-manage_info',
				url: layui.setter.configUrl + "admin/customer_info/grid",
				height: 'full-220',
				toolbar: true,
				defaultToolbar: ['filter'],
				where: {
					project_id: field.project_id,
					task_id: field.task_id,
					status: $('#ci_status').val(),
					type: $('#ci_seas').val(),
					telephone: $('#ci_telephone').val(),
					extno: $('#ci_extension').val(),
					name: $('#ci_name').val(),
					startd: $('#newDateStamp').val().split(" ~ ")[0],
					endd: $('#newDateStamp').val().split(" ~ ")[1],
					conditions: JSON.stringify(condit)
				},
				parseData: function (obj) {

					data = [];
					var field;
					var str1;
					var str2 = {};
					for (var i = 0; i < obj.data.length; i++) {

						str1 = {
							"客户姓名": obj.data[i].name,
							"客户号码": obj.data[i].telephone,
							"呼叫状态": obj.data[i].status,
							"录入日期": obj.data[i].import_stamp,
							"坐席工号": obj.data[i].extno,
							data_status: "呼叫状态",
							fields: obj.data[i].fields,
							uuid: obj.data[i].uuid
						};

						field = JSON.parse(obj.data[i].fields);
						if (obj.data[i].fields == null) {
							field = "{}";
							data.push(str1);
						} else {
							if (field.hasOwnProperty("乡镇地址")) {
								if (field['乡镇地址'] != "") {
									var sc = [];
									sc = field['乡镇地址'].split('/');
									var ssssa = sc[0] + "/" + sc[1] + "/" + sc[2] + "/" + sc[3] + "/" + sc[4];
									field['乡镇地址'] = ssssa;
								}
							}

							str2 = eval('(' + (JSON.stringify(str1) + JSON.stringify(field)).replace(/}{/, ',') + ')');
							data.push(str2);
						}



					}
					//console.log("我是data:" + data.toString());
					//可以在这块区域修改原始数据 
					return {
						"code": obj.code, //解析接口状态
						"msg": obj.msg, //解析提示文本
						"count": obj.count, //解析数据长度
						"data": data //解析数据列表
					};
				},
				//data: data,
				cols: [
					title
				],

				page: true
			});

		});
		$(function () {


		})

		form.on('select(ci_project_id_select)', function (data) { //监听项目下拉框,联动任务,客户状态下拉框
			var project_id_s = data.value;
			condit = [];
			admin.req({ //任务下拉列表
				type: "POST",
				url: layui.setter.configUrl + "admin/project_task/getTaskByProject",
				dataType: 'json',
				data: {
					project_id: project_id_s
				},
				success: function (res) {
					$("#ci_task").empty();
					function sortId(a, b) {
						return a.id - b.id;
					}
					var result = res.data.sort(sortId);
					//var result = res.data;
					$("#ci_task").append("<option value='0'>--任务--</option>");
					for (var i = 0; i < result.length; i++) {
						$("#ci_task").append("<option value=" + result[i].id + ">" + result[i].name + "</option>");
					}
					layui.form.render("select");
				}
			});

			admin.req({
				type: 'POST',
				async: false,
				url: layui.setter.configUrl + "admin/crm_field/listProjectFields",
				data: {
					project_id: project_id_s
				},
				success: function (obj) {
					var result = obj.data;
					$("#cust_info_senior").empty();
					for (let i = 0; i < result.length; i++) {

						if (result[i].is_search == 1) {
							search_list.push(result[i]);
							var temp = "";

							if (result[i].input_type == 1 || result[i].input_type == 4) {
								temp = '<div class="layui-input-inline">';
								temp = temp + '<input name="' + result[i].field_name + '" type="text" autocomplete="off" placeholder=' + result[i].field_name + ' class="layui-input" >';
								temp = temp + '</div>';
							} else if (result[i].input_type == 2) {
								temp = temp + '<div class="layui-input-inline">';
								temp = temp + '<select name="' + result[i].field_name + '" lay-search=""  lay-filter="' + result[i].field_name + '" >';
								var nodes = JSON.parse(result[i].field_json);
								temp = temp + '<option value="">' + result[i].field_name + '</option>';
								for (k = 0; k < nodes.length; k++) {
									temp = temp + '<option value="' + nodes[k].name + '">' + nodes[k].name + '</option>';
								}
								temp = temp + '</select>';
								temp = temp + '</div>';
							}
							else if (result[i].input_type == 3) {
								var nodes = JSON.parse(result[i].field_json);
								var sub_data = [];
								var sub_list = {};
								for (var j = 0; j < nodes.length; j++) {
									sub_list = {};
									sub_list.name = nodes[j].name;
									sub_list.value = nodes[j].name;
									sub_data.push(sub_list);
								}

								temp = $([
									'<div class="layui-input-inline" style="margin-left:15px">',
									'<div class="hobby"></div>',
									'</div>',
								].join(''))

								var demo = temp.find(".hobby")[0];
								xmSelect.render({
									el: demo,
									toolbar: {
										show: true,
									},
									tips: result[i].field_name,
									name: result[i].field_name,
									data: function () {
										return sub_data
									}
								})
							}
							$("#cust_info_senior").append(temp);
						}



						// if (result[i].field_name.substr(0,1)=="F" || result[i].field_name.substr(0,1)=="D") {

						// }
					}
					form.render();

				}

			})




		})

		var active = {
			batch: function () {
				var checkStatus = table.checkStatus('LAY-user-manage_info'),
					datas = checkStatus.data;
				var uuids = "";
				for (var i = 0; i < datas.length; i++) {
					if (uuids != "") {
						uuids = uuids + ',' + datas[i].uuid;
					} else {
						uuids = datas[i].uuid;
					}
				}

				if (datas.length == 0) {
					layer.msg("请选择用户")
					return;
				}
				admin.popup({
					title: '批量分配',
					area: ['500px', '250px'],
					id: 'LAY-popup-user-batch',
					btn: ['提交', '取消'],
					success: function (layero, index) {
						view(this.id).render('management/cust_info/batch').done(function () {
							form.render(null, 'layuiadmin-form-cust-info-batch');
							getProjectAgent($("#ci_project").val());
							//监听提交
							form.on('submit(LAY-user-front-cust-info-batch-submit)', function (data) {
								layer.load();
								var field = data.field; //获取提交的字段
								//提交 Ajax 成功后，关闭当前弹层并重载表格
								admin.req({
