<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title></title>
  </head>

  <body>
    <input
      type="file"
      id="hidden_batch_upload_input"
      multiple
      accept=".csv,.txt"
      style="display: none"
    />

    <div class="layui-fluid">
      <div class="layui-card">
        <div
          class="layui-form layui-card-header layuiadmin-card-header-auto"
          lay-filter="layadmin-userfront-formlist-project-task"
        >
          <div class="layui-form-item">
            <div class="layui-inline" id="protect_task_p">
              <label class="layui-form-label">项目名称</label>
              <div class="layui-input-inline">
                <select id="project_ids" name="project_id"></select>
              </div>
            </div>
            <div class="layui-inline">
              <label class="layui-form-label">执行状态</label>
              <div class="layui-input-inline">
                <select id="status" name="status">
                  <option value="-1">全部</option>
                  <option value="1">运行中</option>
                  <option value="0">已停止</option>
                </select>
              </div>
            </div>
            <div class="layui-inline">
              <label class="layui-form-label">任务名称</label>
              <div class="layui-input-inline">
                <input
                  type="text"
                  name="name"
                  placeholder="请输入"
                  autocomplete="off"
                  class="layui-input"
                />
              </div>
            </div>

            <div class="layui-btn-group" style="float: right">
              <button
                class="layui-btn layuiadmin-btn-useradmin"
                title="查询"
                id="user_task_search"
                lay-submit
                lay-filter="LAY-user-front-search-project-task"
              >
                <i class="layui-icon layui-icon-search layuiadmin-button-btn"></i>查询
              </button>

              <button
                class="layui-btn layuiadmin-btn-primary layuiadmin-btn-useradmin"
                title="增加"
                data-type="add"
              >
                <i class="layui-icon layui-icon-add-1 layuiadmin-button-btn"></i>
              </button>

              <button
                class="layui-btn layuiadmin-btn-primary layuiadmin-btn-useradmin layui-bg-blue"
                title="批量上传"
                data-type="batchUpload"
              >
                <i class="layui-icon layui-icon-upload-drag layuiadmin-button-btn"></i>
              </button>

              <button
                class="layui-btn layuiadmin-btn-primary layuiadmin-btn-useradmin layui-btn-danger"
                title="删除"
                data-type="batchdel"
              >
                <i class="layui-icon layui-icon-delete layuiadmin-button-btn"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="layui-card-body">
          <table
            id="LAY-user-manage-project-task"
            lay-filter="LAY-user-manage-project-task"
          ></table>
        </div>
      </div>
    </div>
  </body>
  <style>
    .layui-form-label {
      width: 100px;
    }
  </style>

  <script>
    var $;
    var admin_name = "";
    layui.use(["admin", "table", "upload", "xmSelect", "laydate"], function () {
      var table = layui.table;
      form = layui.form;
      $ = layui.$;
      view = layui.view;
      admin = layui.admin;
      upload = layui.upload;
      element = layui.element;
      xmSelect = layui.xmSelect;
      laydate = layui.laydate;

      $(function () {
        admin.req({
          url: layui.setter.configUrl + "menu/info",
          async: false,
          done: function (res) {
            admin_name = res.data.name;
          },
        });

        if (
          layui.data("layuiAdmin")[window.sessionStorage.getItem("name")]["role"] != "super_admin"
        ) {
          admin.req({
            //执行项目下拉列表
            type: "POST",
            url: layui.setter.configUrl + "admin/project/list",
            dataType: "json",
            success: function (res) {
              var result = res.data;
              $("#project_ids").append("<option value='0'>--请选择--</option>");
              for (var i = 0; i < result.length; i++) {
                $("#project_ids").append(
                  "<option value=" + result[i].id + ">" + result[i].name + "</option>",
                );
              }
              layui.form.render("select");
            },
          });
        }
      });

      var timeInfo = [];
      var timeInfoId = {};
      admin.req({
        type: "POST",
        url: layui.setter.configUrl + "admin/schedule/getInfo",
        async: false,
        dataType: "json",
        success: function (obj) {
          timeInfo = obj.data;
          for (let i = 0; i < timeInfo.length; i++) {
            const element = timeInfo[i];
            timeInfoId[element.id] = element;
          }
        },
      });

      table.render({
        method: "POST",
        elem: "#LAY-user-manage-project-task",
        url: layui.setter.configUrl + "admin/project_task/grid",
        height: "full-180",
        where: {
          project_id: 0,
          name: "",
          status: "-1",
        },
        cols: [
          [
            {
              type: "checkbox",
            },
            {
              field: "name",
              title: "任务名称",
              edit: true,
              align: "center",
              minWidth: 350,
            },
            {
              field: "projectName",
              title: "执行项目",
              align: "center",
              minWidth: 250,
              templet: function (d) {
                if (d.outboundType == 1) return d.projectName + "(预测外呼)";
                else if (d.outboundType == 2) return d.projectName + "(比例外呼)";
                else if (d.outboundType == 3) return d.projectName + "(自动外呼)";
                else if (d.outboundType == 4) return d.projectName + "(点击外呼)";
                else if (d.outboundType == 5) return d.projectName + "(预览外呼)";
              },
            },
            {
              field: "create_stamp",
              title: "创建时间",
              align: "center",
              minWidth: 180,
            },
            {
              field: "noCall_count",
              title: "进度",
              sort: true,
              align: "center",
              minWidth: 180,
              templet: function (d) {
                return (
                  '<div class="layui-progress" lay-showpercent="true" title="未呼条数(' +
                  d.noCalls +
                  ')条" style="margin-top:15px;background-color:red;"><div class="layui-progress-bar"  lay-percent="' +
                  d.noCalls +
                  " / " +
                  d.total +
                  '"></div></div>'
                );
              },
            },
            {
              field: "status",
              title: "执行状态",
              align: "center",
              sort: true,
              minWidth: 100,
              templet: function (d) {
                if (d.status == 0) {
                  return (
                    '<a class="layui-btn layui-btn-xs layui-btn-danger" title="点击执行该项目" onclick="project_task_tool.editStatus(' +
                    d.id +
                    ',1);">已停止</a>'
                  );
                }
                if (d.status == 2) {
                  return '<a class="layui-btn layui-btn-xs" title="点击执行该项目">处理中</a>';
                } else {
                  return (
                    '<a class="layui-btn layui-btn-xs" title="点击停止该项目" onclick="project_task_tool.editStatus(' +
                    d.id +
                    ',0);">正在执行</a>'
                  );
                }
              },
            },
            {
              field: "caozuo",
              title: "操作",
              align: "center",
              fixed: "right",
              minWidth: 300,
              templet: function (d) {
                var result = "";
                result =
                  result +
                  '<img style="cursor:pointer;margin-left:16px;" title="导入数据" onclick="project_task_tool.import(' +
                  d.id +
                  "," +
                  d.project_id +
                  ')" src="../start/images/data_add.png">';
                result =
                  result +
                  '<img style="cursor:pointer;margin-left:16px;" title="快速导入" onclick="project_task_tool.quick_import(' +
                  d.id +
                  "," +
                  d.project_id +
                  ')" src="../start/images/quick_import.png">';
                result =
                  result +
                  '<img style="cursor:pointer;margin-left:16px;" title="清空未呼数据" onclick="project_task_tool.clear(' +
                  d.id +
                  "," +
                  d.project_id +
                  ')" src="../start/images/data_clear.png">';
                result =
                  result +
                  '<img style="cursor:pointer;margin-left:16px;" title="回收未接数据" onclick="project_task_tool.recovery(' +
                  d.id +
                  "," +
                  d.project_id +
                  ')" src="../start/images/data_recovery.png">';
                result =
                  result +
                  '<img style="cursor:pointer;margin-left:16px;" title="定时器" lay-event="onTimeClose" src="../start/images/timer.png">';
                result =
                  result +
                  '<img style="cursor:pointer;margin-left:16px;" title="时间线" lay-event="time_line" src="../start/images/time_line.png">';
                result =
                  result +
                  '<img style="cursor:pointer;margin-left:16px;" title="实时监控" onclick="project_task_tool.open(' +
                  d.project_id +
                  ');" src="../start/images/monitor.png">';
                return result;
              },
            },
          ],
        ],
        done: function (obj) {
          if (location.hash == "#/control/project_task") {
            layer.tips("执行和停止任务点我哦~", ".layui-table-header th:eq(5)", {
              tips: [1, "#78BA32"],
              time: 2000,
            });
          }
          element.render();
        },
        page: true,
      });

      form.render(null, "layadmin-userfront-formlist-project-task");

      //监听搜索
      form.on("submit(LAY-user-front-search-project-task)", function (data) {
        var field = data.field;
        table.reload("LAY-user-manage-project-task", {
          where: field,
          page: { curr: 1 },
        });
      });

      table.on("sort(LAY-user-manage-project-task)", function (obj) {
        table.reload("LAY-user-manage-project-task", {
          initSort: obj,
        });
      });

      //监听单元格编辑
      table.on("edit(LAY-user-manage-project-task)", function (obj) {
        var value = obj.value,
          data = obj.data,
          field = obj.field;
        if (field == "name") {
          if (value != "") {
            admin.req({
              type: "POST",
              url: layui.setter.configUrl + "admin/project_task/editName",
              data: { id: data.id, name: value },
              dataType: "json",
              success: function (obj) {
                if (obj.data > 0) {
                  layer.msg("任务名称修改成功", { icon: 1 });
                } else {
                  layer.msg("修改失败,请重试", { icon: 2 });
                }
              },
            });
          } else {
            layer.msg("修改失败,名称不能为空", { icon: 2 });
          }
        }
      });

      //监听行工具栏
      table.on("tool(LAY-user-manage-project-task)", function (obj) {
        var data = obj.data,
          layEvent = obj.event;
        if (layEvent === "onTimeClose") {
          admin.popupRight({
            title: "任务定时计划",
            area: "600px",
            id: "LAY-popup-user-timer",
            success: function (layero, index) {
              view(this.id)
                .render("control/project_task/timer")
                .done(function () {
                  form.render(null, "layuiadmin-form-project_task_timer");
                  let weekDays = [];
                  if (data.timer != null && data.timer != "{}") {
                    weekDays = JSON.parse(data.timer).weekDays;
                    let task_time_data = JSON.parse(data.timer).slots;
                    for (let i = 0; i < task_time_data.length; i++) {
                      addnode(1, task_time_data[i].start + " - " + task_time_data[i].end);
                    }
                  }
                  days(weekDays);

                  form.on("submit(LAY-user-front-project_task-timer-submit)", function (datas) {
                    var field = datas.field;
                    var reqTimer = [];
                    $("#nodes")
                      .children()
                      .each(function (i, n) {
                        var obj = $(n).find("input");
                        if ($(obj[0]).val() != "") {
                          var teach = {};
                          teach.start = $(obj[0]).val().split(" - ")[0].substring(0, 5);
                          teach.end = $(obj[0]).val().split(" - ")[1].substring(0, 5);
                          reqTimer.push(teach);
                        }
                      });
                    if (reqTimer.length == 0) return layer.msg("请添加时段", { icon: 2 });
                    if (reqTimer.length > 4) return layer.msg("最多选择四个呼叫时段", { icon: 2 });

                    let timer = {};
                    timer.slots = reqTimer;
                    timer.weekDays = field.weekDays.split(",");
                    layer.load();
                    admin.req({
                      type: "POST",
                      url: layui.setter.configUrl + "admin/project_task/editTimer",
                      data: { id: data.id, timer: JSON.stringify(timer) },
                      dataType: "json",
                      success: function (obj) {
                        layer.closeAll("loading");
                        if (obj.data > 0) {
                          layer.msg("设置成功", { icon: 1 });
                          layui.table.reload("LAY-user-manage-project-task");
                          layer.close(index);
                        } else {
                          layer.msg("操作失败,请重试", { icon: 2 });
                        }
                      },
                    });
                  });
                });
            },
          });
        } else if (layEvent === "time_line") {
          let time_line = JSON.parse(data.time_line);
          time_line = time_line.reverse();
          admin.popupRight({
            title: "时间线",
            area: "500px",
            id: "LAY-popup-user-time_line",
            success: function (layero, index) {
              view(this.id)
                .render("control/project_task/time_line")
                .done(function () {
                  form.render(null, "layuiadmin-form-project_task_timeLineLogs");
                  $("#timeLineLogs").empty();
                  for (var i = 0; i < time_line.length; i++) {
                    let result = JSON.parse(time_line[i]);
                    $("#timeLineLogs").append(
                      '<li class="layui-timeline-item"><i class="layui-icon layui-timeline-axis"></i><div class="layui-timeline-content layui-text"><h3 class="layui-timeline-title">' +
                        result.time +
                        "</h3><p>" +
                        result.msg +
                        "</p></div></li>",
                    );
                  }
                  $("#timeLineLogs").append(
                    '<li class="layui-timeline-item"><i class="layui-icon layui-timeline-axis"></i><div class="layui-timeline-content layui-text"><div class="layui-timeline-title">没有更多啦</div></div></li>',
                  );
                });
            },
          });
        } else if (layEvent === "editBotId") {
          admin.popup({
            title: "更改AI机器人",
            area: ["600px", "300px"],
            id: "LAY-popup-user-editBot",
            resize: false,
            btn: ["提交", "取消"],
            success: function (layero, index) {
              view(this.id)
                .render("control/project_task/editBotId")
                .done(function () {
                  form.render(null, "layuiadmin-form-project_task_editBot");
                  var bot_id = "";
                  if (data.remark != "" && data.remark != null) {
                    bot_id = JSON.parse(data.remark).bot_id;
                  }
                  editBotSelect(bot_id);
                  form.on("submit(LAY-user-front-project_task-editBot-submit)", function (datas) {
                    var field = datas.field;
                    var bot_id = field.bot_id == "" ? null : field.bot_id;
                    layer.load();
                    admin.req({
                      type: "POST",
                      url: layui.setter.configUrl + "admin/project_task/editBot",
                      data: { id: data.id, bot_id: bot_id },
                      dataType: "json",
                      success: function (obj) {
                        layer.closeAll("loading");
                        if (obj.data > 0) {
                          layer.msg("操作成功", { icon: 1 });
                          layui.table.reload("LAY-user-manage-project-task");
                          layer.close(index);
                        } else {
                          layer.msg("操作失败", { icon: 2 });
                        }
                      },
                    });
                  });
                });
            },
            yes: function (index, layero) {
              layero.find("#project_task_editBot").click();
            },
          });
        }
      });

      // 事件定义区
      var active = {
        // 【新增】：一键批量新建任务并上传的完整联动逻辑
        batchUpload: function () {
          var project_id = $("#project_ids").val();
          if (!project_id || project_id == "0") {
            return layer.msg("请先在左侧选择要上传到的【项目名称】！", { icon: 2, time: 2500 });
          }
          // 触发隐藏的 input 唤起操作系统的文件选择框
          $("#hidden_batch_upload_input").val(""); // 清空旧数据
          $("#hidden_batch_upload_input").click();
        },

        batchdel: function () {
          var checkStatus = table.checkStatus("LAY-user-manage-project-task"),
            checkData = checkStatus.data;

          var ids = "";
          for (var i = 0; i < checkData.length; i++) {
            if (ids != "") {
              ids = ids + "," + checkData[i].id;
            } else ids = checkData[i].id;
          }
          if (checkData.length === 0) return layer.msg("请选择数据", { icon: 2 });

          layer.confirm("确定删除吗？", { icon: 3 }, function (index) {
            layer.load();
            admin.req({
              type: "post",
              url: layui.setter.configUrl + "admin/project_task/remove",
              dataType: "json",
              data: { ids: ids, project_id: checkData[0].project_id },
              success: function (obj) {
                layer.closeAll("loading");
                if (obj.data > 0) {
                  layer.msg("已删除", { icon: 1 });
                  table.reload("LAY-user-manage-project-task");
                } else {
                  layer.msg("删除失败,请重试", { icon: 2 });
                }
              },
            });
          });
        },

        add: function () {
          admin.popup({
            title: "新建任务",
            area: ["650px", "400px"],
            id: "LAY-popup-user-add",
            resize: false,
            btn: ["提交", "取消"],
            success: function (layero, index) {
              view(this.id)
                .render("control/project_task/add")
                .done(function () {
                  form.render(null, "layuiadmin-form-project_task_add");
                  $("#timer").append('<option value="">请选择定时器</option>');
                  for (let i = 0; i < timeInfo.length; i++) {
                    const element = timeInfo[i];
                    $("#timer").append(
                      "<option value=" + element.id + ">" + element.task_desc + "</option>",
                    );
                  }

                  form.on("submit(LAY-user-front-project_task-submit)", function (data) {
                    var field = data.field;
                    if (field.project_id == 0) return layer.msg("请选择执行项目", { icon: 2 });
                    if ($("#existnames").html() == "任务名称已存在")
                      return layer.msg("任务名称重复,请换一个试试", { icon: 2 });

                    let timer = {};
                    if (field.timer != "") {
                      timer.slots = JSON.parse(timeInfoId[field.timer].task_time);
                      timer.weekDays = resetTaskWeek(timeInfoId[field.timer].task_week);
                    }
                    field.timer = JSON.stringify(timer);
                    layer.load();
                    admin.req({
                      type: "POST",
                      url: layui.setter.configUrl + "admin/project_task/add",
                      data: field,
                      dataType: "json",
                      success: function (obj) {
                        layer.closeAll("loading");
                        if (obj.data > 0) {
                          layer.msg("操作成功", { icon: 1 });
                          layui.table.reload("LAY-user-manage-project-task");
                          layer.close(index);
                        } else {
                          layer.msg("操作失败", { icon: 2 });
                        }
                      },
                    });
                  });
                });
            },
            yes: function (index, layero) {
              layero.find("#project_task_add").click();
            },
          });
        },
      };

      // 绑定顶部按钮点击事件
      $(".layui-btn.layuiadmin-btn-useradmin").on("click", function () {
        var type = $(this).data("type");
        active[type] ? active[type].call(this) : "";
      });

      // 【新增】：监听文件选择器变化，执行核心的批处理逻辑
      $("#hidden_batch_upload_input").on("change", async function (e) {
        var files = e.target.files;
        if (!files || files.length === 0) return;

        var project_id = $("#project_ids").val();
        // 全局提取自带的合法 Token，完全脱离手动复制
        var token = layui.data("layuiAdmin")[window.sessionStorage.getItem("name")]["access_token"];
        // 核心修复：强制按文件名进行“自然顺序”正序排序（支持 A2 排在 A10 前面的高级排序）
        var fileArr = Array.from(files).sort(function (a, b) {
          return a.name.localeCompare(b.name, undefined, { numeric: true });
        });
        var successCount = 0;
        var failCount = 0;

        // 开启不可被手动关闭的全屏透明遮罩 Loading
        var loading = layer.msg("正在批量创建任务并导入数据，请勿关闭或刷新页面...", {
          icon: 16,
          shade: [0.5, "#000"],
          time: false,
        });

        for (var i = 0; i < fileArr.length; i++) {
          var file = fileArr[i];
          try {
            // 步骤 1：先向后端申请创建任务
            var addRes = await new Promise(function (resolve, reject) {
              admin.req({
                type: "POST",
                url: layui.setter.configUrl + "admin/project_task/add",
                data: {
                  project_id: project_id,
                  name: file.name,
                },
                success: function (res) {
                  resolve(res);
                },
                error: function (err) {
                  reject(err);
                },
              });
            });

            // ====================================================
            // 【终极防乱序修复】：强制休眠 1000 毫秒 (1秒)
            // 确保每个任务创建时间严格岔开，防止 MySQL 遇到同秒数据乱排
            // ====================================================
            await new Promise((resolve) => setTimeout(resolve, 1000));

            // 如果任务创建成功，拿到生成的 task_id
            if (addRes && addRes.data > 0) {
              var task_id = addRes.data;

              // 步骤 2：组装表单数据，正式上传文件给这个新 task_id
              var formData = new FormData();
              formData.append("file", file, file.name);
              formData.append("project_id", project_id);
              formData.append("task_id", task_id);
              formData.append("filter", "0");
              formData.append("order", "0");
              formData.append("black", "0");
              formData.append("asyn", "true"); // 异步处理防卡死
              formData.append("cover", "false");

              // 发起原生 Ajax 上传
              var importRes = await $.ajax({
                url: layui.setter.configUrl + "admin/project_task/import",
                type: "POST",
                headers: { access_token: token }, // 自带身份认证
                data: formData,
                processData: false,
                contentType: false,
              });

              // 判断是否上传成功
              if (importRes.code === 0 && importRes.data !== -1) {
                successCount++;
              } else {
                failCount++;
              }
            } else {
              failCount++;
            }
          } catch (error) {
            console.error("【文件处理异常】: " + file.name, error);
            failCount++;
          }
        }

        // 处理全部结束，关掉 Loading 动画
        layer.close(loading);

        // 弹窗汇总报告
        layer.alert(
          "批量导入工作流结束！<br><br>成功处理：<b style='color:green;'>" +

                      temp += "</div>";
                    }
                    temp += "</div></div>";
                    $("#recovery_id").append(temp);
                  },
                });
                form.render(null, "layuiadmin-form-project_task_recovery");

                var likeCheckBoxData = ["like[0]"];
                form.on("checkbox(likeCheckBox)", function (data) {
                  var likeCheckBox_val = data.value;
                  if (likeCheckBoxData.includes(data.elem.name)) {
                    var index = likeCheckBoxData.indexOf(data.elem.name);
                    likeCheckBoxData.splice(index, 1);
                  } else {
                    likeCheckBoxData.push(data.elem.name);
                  }
                  if (
                    likeCheckBoxData.length == 0 ||
                    (likeCheckBoxData.length == 1 && likeCheckBoxData[0] == "like[0]")
                  ) {
                    $("#rec_billsec").val("");
                    $("#recovery_billsec").css("display", "none");
                  } else {
                    $("#recovery_billsec").css("display", "");
                  }
                  form.render();
                });

                form.on("submit(LAY-user-front-project_task-recovery-submit)", function (data) {
                  var field = data.field;
                  var type = 0;
                  if (field.hasOwnProperty("type")) {
                    type = 1;
                    delete field.type;
                  }
                  if (Object.keys(field).length == 0)
                    return layer.msg("客户类型至少选择一项", { icon: 2 });
                  var statusIds = "";
                  var ringStatus = "";
                  for (var key in field) {
                    if (key.indexOf("like") != -1) {
                      if (statusIds == "") statusIds = key.replace("like[", "").replace("]", "");
                      else statusIds += "," + key.replace("like[", "").replace("]", "");
                    }
                    if (key.indexOf("ringStatus") != -1) {
                      if (ringStatus == "")
                        ringStatus = key.replace("ringStatus[", "").replace("]", "");
                      else ringStatus += "," + key.replace("ringStatus[", "").replace("]", "");
                    }
                  }
                  if (field.billsec != "") {
                    if (/^[0-9]\d*(\d+)?$/.test(field.billsec) == false) {
                      return layer.msg("时长大于多少秒必须填写正整数", { icon: 2 });
                    }
                    var newStatusIds = statusIds.split(",");
                    if (newStatusIds.length == 1 && newStatusIds[0] == 0) {
                      return layer.msg("时长大于0时，必须勾选一个已接的客户状态", { icon: 2 });
                    }
                  }
                  if (statusIds == "") return layer.msg("请选择至少选择一条客户状态", { icon: 2 });
                  if (ringStatus == "")
                    return layer.msg("请选择至少选择一条剔除通话状态", { icon: 2 });

                  layer.load();
                  admin.req({
                    type: "POST",
                    url: layui.setter.configUrl + "admin/project_task/recovery",
                    dataType: "json",
                    data: {
                      id: id,
                      statusIds: statusIds,
                      type: type,
                      ringStatus: ringStatus,
                      billsec: field.billsec,

                    success: function (obj) {
                      layer.closeAll("loading");

                        layer.msg("已成功回收" + obj.data + "条数据", { icon: 1 });
                        layer.close(index);

                        layui.table.reload("LAY-user-manage-project-task");
                      }
                    },
                  });
                });
              });
          },
          yes: function (index, layero) {
            layero.find("#project_task_recovery").click();
          },
        });
      },

    function filterRepeatStr(str) {
      var ar2 = str.split(",");
      var array = new Array();
      var j = 0;
      for (var i = 0; i < ar2.length; i++) {
        if (
          (array == "" || array.toString().match(new RegExp(ar2[i], "g")) == null) &&
          ar2[i] != ""
        ) {
          array[j] = ar2[i];
          array.sort();
          j++;
        }
      }
      return array.toString();
    }
    function resetTaskWeek(task_week) {
      return task_week.split(",").map((item) => {
        return String((Number(item) + 1) % 7 || 7);
      });
    }
