<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>上传文件</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="shortcut icon" href="favicon.ico" />
    <script src="layui/layui.js"></script>

    <div class="layui-fluid">

                            <div class="layui-col-md12">

                                <div class="layui-form layui-card-header layuiadmin-card-header-auto"

                                    <div class="layui-form-item">
                                        <div class="layui-inline">

                                            <label class="layui-form-label">任务名称</label>

                                            <div class="layui-input-inline">

                                                <input type="text" name="name" placeholder="请输入" autocomplete="off"
                                                    class="layui-input">

                                            </div>

                                        </div>
                                        <div class="layui-inline">
                                            <label class="layui-form-label">执行状态</label>
                                            <div class="layui-input-inline">

                                                    <option value="-1">全部</option>
                                                    <option value="1">运行中</option>
                                                    <option value="0">已停止</option>

                                        </div>

                                            <button class="layui-btn layuiadmin-btn-primary layuiadmin-btn-useradmin"

                                            <button

                                    </div>

                                </div>

                                        <a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="startUp">启动</a>
                                        {{# } }}
                                        {{# if(d.status==1){ }}
                                        <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="startEnd">停止</a>
                                        {{# } }}
                                        <a class="layui-btn layui-btn-xs" lay-event="upload">上传</a>
                                        <a class="layui-btn layui-btn-xs" lay-event="fileList">文件列表</a>
                                        <a class="layui-btn layui-btn-xs" lay-event="onUpload">全部上传</a>
                                        <a class="layui-btn layui-btn-xs" lay-event="noUpload">清空上传</a>
                                       
                                    </script>

                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    </div>
</body>
<style>
    .layui-layout-body {
        overflow-y: auto;

</style>
<script>
   // let url = window.location.protocol+"//"+ window.location.hostname +":8871/";

                            //     ,'<td>'+ (file.size/1014).toFixed(1) +'kb</td>'
                            //     ,'<td></div><div class="layui-progress" lay-showPercent="yes" lay-filter="progress-demo-'+ index +'"><div class="layui-progress-bar" id="uploadImg'+index+'" lay-percent="0%"></div></div></td>'
                            //     ,'<td>'
                            //         ,'<button class="layui-btn layui-btn-xs demo-reload layui-hide">重传</button>'
                            //         ,'<button class="layui-btn layui-btn-xs layui-btn-danger demo-delete">删除</button>'
                            //     ,'</td>'
                            //     ,'</tr>'].join(''));
                                
                            //     //单个重传
                            //     tr.find('.demo-reload').on('click', function(){
                            //     obj.upload(index, file);
                            //     });
                                
                            //     //删除
                            //     tr.find('.demo-delete').on('click', function(){
                            //     delete files[index]; //删除对应的文件
                            //     tr.remove();
                            //     uploadListIns.config.elem.next()[0].value = ''; //清空 input file 值，以免删除后出现同名文件不可选
                            //     });
                                
                            //     that.elemList.append(tr);
                            //     element.render('progress'); //渲染新加的进度条组件
                            // });
                            },
                            before: function (obj) {
                                this.data = {
                                    "taskId": data.id
                                }; //关键代码

                            },
                            done: function(res, index, upload){ //成功的回调
                                //console.log( this.item)
                                // var that = this;
                                // //if(res.code == 0){ //上传成功
                                //     var tr = that.elemList.find('tr#upload-'+ index)
                                //     ,tds = tr.children();
                                //     tds.eq(3).html(''); //清空操作
                                //     delete this.files[index]; //删除文件队列已经上传成功的文件
                                //     return;
                                // //}
                                // this.error(index, upload);
                            }
                            ,allDone: function(obj){ //多文件上传完毕后的状态回调
                            }
                            ,error: function(index, upload){ //错误回调
                                var that = this;
                                var tr = that.elemList.find('tr#upload-'+ index)
                                ,tds = tr.children();
                                tds.eq(3).find('.demo-reload').removeClass('layui-hide'); //显示重传
                            }

                    });
                })

            }else if(layEvent === 'startUp'){

                            layer.msg("操作成功", {

                                            }

                                            where: field,
                                            page: {
                                                curr: 1
                                            }
                                        });

                                    });

                                                    layEvent = objs.event;
                                                if (layEvent === 'removefileList') { 
                                                    admin.req({
                                                        type: "post",
                                                        url: url + 'upload/fileList/remove',
                                                        dataType: "json",
                                                        data: {
                                                            id: datas.id
                                                        },
                                                        success: function (obj) {

                                                            layer.closeAll('loading');

                                                            if (obj.data > 0) {

                                                                layer.msg("已删除", {
                                                                    icon: 1
                                                                });

                                                                    icon: 2
                                                                });

                                                        }

                                                    admin.req({
                                                        type: "post",
                                                        url: url + 'upload/fileList/editStatus',
                                                        dataType: "json",
                                                        data: {
                                                            id: datas.id,
                                                            status: 0
                                                        },
                                                        success: function (obj) {

                                                            layer.closeAll('loading');

                                                            if (obj.data > 0) {

                                                                layer.msg("操作成功", {
                                                                    icon: 1
                                                                });

                                                                table.reload('LAY-user-manage-task-fileList');

                                                            } else {

                                                                    icon: 2
                                                                });

                                                                });

                                                                table.reload('LAY-user-manage-task-fileList');

                                                            } else {

                                                                    icon: 2
                                                                });

                                                            }

                                                        }

                                                    });

        //事件

			add: function () {
                layui.use(['form', 'table', 'admin', 'view'], function () {
                    table = layui.table;
                    form = layui.form;
                    admin = layui.admin;
                    view = layui.view;

                        title: '添加任务',
                        area: ['500px','250px'],

                                        }
                                    });

                    if (ids != "") {
                        ids = ids + "," + checkData[i].id;
                    } else
                        ids = checkData[i].id;
                }
                if (checkData.length === 0) {
                    return layer.msg('请选择数据', {
                        icon: 2
                    });
                }
                layer.confirm('确定删除吗？', {

                    icon: 3

                    //执行 Ajax 后重载
                    layer.load();

                        type: "post",
                        url: url + 'upload/task/remove',
                        dataType: "json",
                        data: {
                            ids: ids
                        },
                        success: function (obj) {

                            layer.closeAll('loading');

                            if (obj.data > 0) {

                                layer.msg("已删除", {
                                    icon: 1
                                });

                                table.reload('LAY-user-manage-project-task');

                            } else {

                                layer.msg("删除失败,请重试", {
                                    icon: 2
                                });

                            }

                        }

                    });


                });

                }
        }
        $('.layui-btn.layuiadmin-btn-useradmin').on('click', function () {
			var type = $(this).data('type');
			active[type] ? active[type].call(this) : '';
		});
    })
</script>

</html>
