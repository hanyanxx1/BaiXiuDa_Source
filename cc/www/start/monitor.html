<script>
	layui.config({
		base: '../src/',
		version: new Date().getTime()
	}).extend().use('index');

	var urls = location.href;
	var req_project_id = urlToObj(urls).id;
	var interval = 0;
	var taskInterval = 0;    // 专门用于 taskReportData (任务报表)
	var url = '/../';
	var timestamp = "";
	var table;
	var taskTableIns = null;
	var invisibleTaskInterval = 0; // 专属5秒静默轮询的定时器
	var stoppingTasks = {}; // 内存锁：防抖、防多开浏览器产生的“惊群效应”并发

	// ===================== 云端配置接管模块 开始 =====================
	// 废弃原云端地址: var CLOUD_API = "https://viwl6dnnp9.sealosbja.site/sync_config";
	var LOCAL_API = "/api/report/taskReport/syncConfig";

	// 【数据去处】：这里是系统状态的唯一信源，初始赋予安全默认值兜底
	var isTaskAutoMode = false;
	var savedSuccessRate = "0.5%";
	var savedCallFee = "15";
	var lastSaveTime = 0; // 记录最后一次保存的时间锁

	/**
	 * 从本地服务器加载配置
	 * @param {String|Number} project_id - 【数据来处】：由外部显式传入
	 */
	function loadConfigFromServer(project_id) {
		if (project_id === undefined || project_id === null || project_id === "" || project_id == 0 || project_id == "0") {
			console.warn("loadConfigFromServer拦截：非法的 project_id (" + project_id + ")，使用默认兜底值。");
			return;
		}

		$.ajax({
			url: LOCAL_API,
			type: 'POST', // 适配 NestJS @Post 接口
			contentType: 'application/json',
			data: JSON.stringify({ action: "load", project_id: String(project_id) }),
			async: false, // 必须同步阻塞，保障渲染前数据就位
			success: function (res) {
				// 严格适配 NestJS 的返回体 {code: 200, message: '...', data: {...}}
				if (res && res.code === 200 && res.data) {
					// 兼容 MySQL tinyint(1) 返回的 1/0 或 true/false
					isTaskAutoMode = (res.data.isTaskAutoMode == 1 || res.data.isTaskAutoMode === true);
					savedSuccessRate = res.data.savedSuccessRate ? String(res.data.savedSuccessRate) : "0.5%";
					savedCallFee = res.data.savedCallFee ? String(res.data.savedCallFee) : "15";
				}
			},
			error: function (err) {
				console.error("loadConfigFromServer异常：网络或接口请求失败。", err);
			}
		});
	}

	/**
	 * 保存配置到本地服务器
	 * 【数据来处】：主动抓取当前页面下拉框的真实选中值
	 */
	function saveConfigToServer() {
		var current_project_id = $("#project_active").val();

		if (current_project_id === undefined || current_project_id === null || current_project_id === "" || current_project_id == 0 || current_project_id == "0") {
			console.warn("saveConfigToServer拦截：当前未选中有效项目 (" + current_project_id + ")，跳过保存。");
			return;
		}

		lastSaveTime = new Date().getTime(); // 每次保存时，打上当前时间戳

		var payload = {
			action: "save",
			project_id: String(current_project_id),
			isTaskAutoMode: isTaskAutoMode === true ? 1 : 0, // 转化为 1/0 存入 MySQL
			savedSuccessRate: String(savedSuccessRate),
			savedCallFee: String(savedCallFee)
		};

		$.ajax({
			url: LOCAL_API,
			type: 'POST',
			contentType: 'application/json',
			data: JSON.stringify(payload),
			success: function (res) {
				if (res && res.code === 200) {
					console.log("项目 " + current_project_id + " 的配置已同步至本地服务器。");
				}
			}
		});
	}

	/**
	 * 异步静默同步本地服务器配置（用于定时器后台更新，绝对不卡顿UI）
	 */
	function syncConfigFromServerAsync(project_id) {
			if (project_id === undefined || project_id === null || project_id === "" || project_id == 0 || project_id == "0") {
					return;
			}

			// 【核心加固】：将时间锁延长至 8 秒
			// 理由：确保手动点击“手动模式”后，有足够的时间让数据库完成落盘，
			// 防止 5 秒一次的定时轮询刚好在落盘完成前把旧的“自动模式=1”又读回来。
			if (new Date().getTime() - lastSaveTime < 8000) { 
					return;
			}

			$.ajax({
					url: LOCAL_API,
					type: 'POST',
					contentType: 'application/json',
					data: JSON.stringify({ action: "load", project_id: String(project_id) }),
					async: true,
					success: function (res) {
							if (res && res.code === 200 && res.data) {
									var newAutoMode = (res.data.isTaskAutoMode == 1 || res.data.isTaskAutoMode === true);
									var newSuccessRate = res.data.savedSuccessRate ? String(res.data.savedSuccessRate) : "0.5%";
									var newCallFee = res.data.savedCallFee ? String(res.data.savedCallFee) : "15";

									// 只有当服务器数据和本地内存不一致时，才更新内存并重绘UI
									if (isTaskAutoMode !== newAutoMode || savedSuccessRate !== newSuccessRate || savedCallFee !== newCallFee) {
											isTaskAutoMode = newAutoMode;
											savedSuccessRate = newSuccessRate;
											savedCallFee = newCallFee;

											syncToolbarUI(); 
											console.log("检测到其他用户修改了云端配置，已自动静默同步到本地。");
									}
							}
					}
			});
	}

	// 【修改】封装工具栏 UI 同步方法，解耦左侧面板的更新逻辑，彻底解决初始化显示0的Bug
	function syncToolbarUI(tableData) {
		// 1. 先计算最新数据，并设置 Loading 为兜底
		var executingText = '<i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop"></i>';
		var goodText = executingText;

	function getProjectTaskReport(project_id, timestamp) { //获取成功数排名
		table.render({
			method: "post",
			elem: '#LAY-user-manage-active2',
			url: url + 'admin/agentReport',
			headers: { //通过 request 头传递
				access_token: layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["access_token"]
			},
			where: {
				project_id: project_id,
				date: timestamp
			},
			parseData: function (res) { //表格数据前置处理
				function sortId(a, b) {
					return b.successCount - a.successCount;
				}
				var result = res.data.sort(sortId); //按成功数最大排序
				var re = [];
				if (result.length > 10) {
					for (var i = 0; i < 10; i++) {
						var re1 = {};
						re1['工号'] = result[i].ext;
						re1['成功数'] = result[i].successCount;
						re1['姓名'] = result[i].name;
						re.push(re1);
					}
				} else {
					for (var i = 0; i < result.length; i++) {
						var re1 = {};
						re1['工号'] = result[i].ext;
						re1['成功数'] = result[i].successCount;
						re1['姓名'] = result[i].name;
						re.push(re1);
					}
				}
				return {
					"code": res.code, //解析接口状态
					"msg": res.msg, //解析提示文本
					"count": res.data.length, //解析数据长度
					"data": re //解析数据列表
				};
			},
			cols: [
				[{
					title: '排名',
					align: 'center',
					type: 'numbers'
				}, {
					title: '工号(姓名)',
					align: 'center',
					minWidth: 160, // 【修改】给名字分配绝大部分空间，防止文字被折叠出现省略号
					templet: function (d) {
						return d.工号 + " (" + d.姓名 + ")";
					}
				}, {
					field: '成功数',
					title: '成功数',
					align: 'center',
					width: 80 // 【修改】成功数只需要放数字，直接固定调窄
				}]
			],
			limits: [10, 1000],
			limit: 1000
		});
	}

	function updateLeftPanelGatewayStat(project_id) {
		$.ajax({
			url: url + "admin/getGatewayStat",
			type: 'post',
			dataType: 'json',
			headers: {
				access_token: layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["access_token"]
			},
			data: {
				project_id: project_id
			},
			success: function (res) {
				var totalSpend = 0;
				var totalAccounting = 0;
				// 遍历所有线路/网关，把消费和核算累加（防止多条线路时数据遗漏）
				if (res.data && res.data.length > 0) {
					for (var i = 0; i < res.data.length; i++) {
						totalSpend += parseFloat(res.data[i].spend) || 0;
						totalAccounting += parseFloat(res.data[i].successfulAccounting) || 0;
					}
				}
				// 赋值给左侧面板，并保留两位小数
				$('#left-spend').text(totalSpend.toFixed(2));
				$('#left-success-accounting').text(totalAccounting.toFixed(2));
			}
		});

	function getFormattedTaskReportData(res) {
		var data = [];
		for (let i = 0; i < res.data.length; i++) {
			var element = res.data[i];
			var avgAnswerBillsec = 0
			if (!element.seconds || !element.answer) {
				avgAnswerBillsec = 0;
			} else {
				avgAnswerBillsec = (element.seconds / element.answer).toFixed(2);
			}
			element['avgAnswerBillsec'] = avgAnswerBillsec;
			data.push(element);
		}

		//By:hy 修改排序规则，先按状态排序，再按成功统计排序 2026-02-03 14:30:00
		data.sort(function (a, b) {
			var aStatus = (a.status != 0) ? 1 : 0;
			var bStatus = (b.status != 0) ? 1 : 0;
			if (aStatus != bStatus) {
				return bStatus - aStatus;
			}
			var aSucc = parseFloat(a.successfulPercent) || 0;
			var bSucc = parseFloat(b.successfulPercent) || 0;
			return bSucc - aSucc;
		});
		return data;
	}

	function taskReportData(project_id, timestamp) {
		// 如果处于暂停状态，直接返回不执行刷新
		if (isPauseTaskRefresh) {
			return;
		}

		// 【新增】每60秒刷新时，异步静默检测云端最新配置
		syncConfigFromServerAsync(project_id);

		if (taskTableIns) {
			$.ajax({
				url: url + "admin/getTaskReport",
				type: 'post',
				dataType: 'json',
				headers: {
					access_token: layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["access_token"]
				},
				data: {
					project_id: project_id,
					date: timestamp,
					type: 1
				},
				success: function (res) {
					// 拦截弹窗前发出、此时刚好返回的请求
					if (isPauseTaskRefresh) {
						return; // 强制丢弃这个数据包，不执行重载
					}

					var data = getFormattedTaskReportData(res);

					// 【核心修复】如果当前表格被隐藏（用户切到了其他图表），绝对拦截 reload！
					// 只调用 syncToolbarUI 刷新左侧面板，防止 Layui 在隐藏状态下执行 reload 导致高度坍塌成“无数据”
					var $tableView = $('.layui-table-view[lay-id="LAY-user-manage-active4"]');
					if ($tableView.length > 0 && !$tableView.is(':visible')) {
						syncToolbarUI(data); 
						return; // 强制终止，冻结表格 DOM
					}

					var scrollSelector = ".layui-table-view[lay-id='LAY-user-manage-active4'] .layui-table-main";
					var currScrollTop = $(scrollSelector).scrollTop();
					taskTableIns.reload({
						url: '',
						data: data,
						done: function (res, curr, count) {
							$(scrollSelector).scrollTop(currScrollTop);
							element.render();

							// 恢复头部工具栏状态（自动同步开关和下拉框）
							syncToolbarUI(data);

							//记录筛选状态
							var that = this;
							that.elem.next().on('mousedown', 'input[lay-filter="LAY_TABLE_TOOL_COLS"]+', function () {
								var input = $(this).prev()[0];
								if (input.checked === true) {  // 复选框取消，则加入本地缓存标识
									layui.data('table-filter-monitor-getTaskReport', { key: input.name, value: !input.checked })
								} else {  // 复选框勾上，则移除本地标识
									layui.data('table-filter-monitor-getTaskReport', { key: input.name, remove: true });
								}
							});
						}
					});
				}
			});
			return;
		}
		taskTableIns = table.render({
			method: 'post',
			elem: '#LAY-user-manage-active4',

			},
			success: function (res) {
				// 防御性拦截：如果返回空，或者自动模式被关了，或者正在切状态，直接终止
				if (!res || !res.data || !isTaskAutoMode || isPauseTaskRefresh) return;

				var data = res.data;
				var limitSuccessRate = parseFloat(savedSuccessRate);
				var limitCallFee = parseFloat(savedCallFee);

				for (var i = 0; i < data.length; i++) {
					var task = data[i];

					// 【核心防并发】：只处理运行中的任务 (status != 0) 并且 “内存锁” 里没有它
					if (task.status != 0 && !stoppingTasks[task.taskId]) {
						var actualSuccessRate = parseFloat(task.successfulPercent) || 0; 
						var actualCallFee = parseFloat(task.phone_bill) || 0;            

						// 触发条件：实际花费 >= 设定话费阈值，且 实际成功率 < 设定成功率阈值
						if (actualCallFee >= limitCallFee && actualSuccessRate < limitSuccessRate) {
							console.warn("【静默轮询拦截】发现劣质任务: [" + (task.taskName || task.taskId) + "], 话费:" + actualCallFee + ", 成功率:" + actualSuccessRate + "%。");

							// 1. 立即上锁，防止多开浏览器或下个5秒重复提交！
							stoppingTasks[task.taskId] = true;

							// 2. 弹出不阻挡视线的提示
							layer.msg("检测到指标过低，已自动停止任务: <br>" + (task.taskName || task.taskId), {
								icon: 0,
								offset: 'rb', 
								time: 4000
							});

							// 3. 调现成的方法关闭任务 (该方法内自带关闭成功后去调用 type=1 刷新页面的逻辑)
							monitor_tool.editStatus(task.taskId, 0);

							// 4. 安全兜底：15秒后自动释放内存锁，防止接口意外报错导致永远无法再次操作该任务
							(function(tid) {
								setTimeout(function() {
									delete stoppingTasks[tid];
								}, 15000);
							})(task.taskId);
						}
					}
				}
			}
		});
	}

	function GetPercent(num, total) {
		/// <summary>
		/// 求百分比
		/// </summary>
		/// <param name="num">当前数</param>
		/// <param name="total">总数</param>
		num = parseFloat(num);
		total = parseFloat(total);
		if (isNaN(num) || isNaN(total)) {
			return "-";
		}
		return total <= 0 ? "0%" : (Math.round(num / total * 10000) / 100.00) + "%";
	}

		const date1 = new Date()

	//实时渲染赛数据
	function realTimeRendering() {
		if (intervalControlAllData) {
			clearInterval(intervalControlAllData)
		}
		let allMonitorData;
		intervalControlAllData = setInterval(async () => {
			$.ajax({
				type: 'post',
				url: url + "admin/getNewActive",
				dataType: 'json',
				async: false,
				headers: {
					access_token: layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["access_token"]
				},
				data: {
					project_id: $("#project_active").val()
				},
				success: function (res) {

					allMonitorData = formDataAllMonitorData(res.data)
				}
			});

			if (active6IsHaveData == 0) {
				table.reload('LAY-user-manage-active6', {
					where: { project_id: $("#project_active").val() }
				});
			} else {
				$(".layui-icon-refresh").click();
			}


			// 数据处理----------------------------------------

			echartsMapData.forEach(echartsMapDataItem => {
				echartsMapDataItem.data.forEach(gateItem => {
					let nowDateFromDB = new Date().getTime();
					if (!echartsMapDataItem.domId) {
						return;
					}
					const findGateWay = allMonitorData[echartsMapDataItem["domId"]].find((allMonitorDataItem) => {
						allMonitorDataItem.data && (nowDateFromDB = allMonitorDataItem.data[0][0] || nowDateFromDB)
						return allMonitorDataItem.gateway_id === gateItem.gateway_id && allMonitorDataItem.gatewayName === gateItem.gatewayName
					})
					if (findGateWay) {
						gateItem.data.push(...findGateWay.data)
					} else {
						gateItem.data.push([nowDateFromDB, 0])
					}

				})
			})
			// 数据渲染------------------------------------------
			echartsMapData.forEach(item => {
				item.dom.setOption({
					series: item.data
				})
			})
		}, 10000)
	}


	// 渲染单表
	function initEcharts(echartsMapItem) {
		const echartsDom = document.getElementById(echartsMapItem.domId)
		echartsMapItem.dom = echarts2.init(echartsDom)
		echartsMapItem.resizeObserver = new ResizeObserver(() => {
			echartsMapItem.dom.resize()
		})
		echartsMapItem.resizeObserver.observe(echartsDom)

		const now = new Date()
		const startOfDay = new Date()
		startOfDay.setHours(0, 0, 0, 0)
		const timeDiff = now - startOfDay
		const minutesDiff = Math.floor(timeDiff / 1000 / 60)
		const dataZoomRate = 100 - (30 / minutesDiff) * 100
		const option = {
			title: {
				text: echartsMapItem.title,
				left: 'center'
			},
			grid: {
				left: 50,
				right: 40
			},

					animation: false
				}
			},
			dataZoom: [
				{
					type: 'inside',
					start: dataZoomRate,
					end: 100
				},
				{
					start: 0,
					end: 100
				}
			],
			legend: {
				data: echartsMapItem.data.map((item) => item.name),
				top: '28px',
				type: 'scroll',
				pageButtonPosition: 'inside',
				textStyle: {
					fontSize: 12
				}
			},
			xAxis: {
				type: 'time',
				splitLine: {
					show: true
				},
				axisLabel: {
					rotate: 15,
					formatter: function (value) {
						return `${new Date(value).toLocaleString().split(' ')[1]}`
					}
				}
			},
			yAxis: {
				type: 'value',
				boundaryGap: [0, '100%'],
				splitLine: {
					show: true
				}
			},
			series: echartsMapItem.data
		}
		echartsMapItem.dom.setOption(option, true)
	}


	// 格式化后端数据 表包裹线
	function formDataAllMonitorData(allMonitorData) {
		return allMonitorData.reduce((acc, curr) => {
			for (const key in curr.statNewVOS) {
				if (acc[key]) {
					acc[key].push({
						gateway_id: curr.gateway_id,
						gatewayName: curr.gatewayName,
						gatewayUserName: curr.gatewayUserName,
						data: curr.statNewVOS[key]
					})
				} else {
					acc[key] = [
						{
							gateway_id: curr.gateway_id,
							gatewayName: curr.gatewayName,
							gatewayUserName: curr.gatewayUserName,
							data: curr.statNewVOS[key]
						}
					]
				}
			}
			return acc
		}, {})
	}

	// 初始化折线表折线映射数据
	function initEchartsMap(allMonitorData) {
		const echartsMapData = Object.entries(allMonitorData).map(([key, value]) => {
			return { name: key, data: value }
		})
		return echartsMapData.map((item) => {
			return {
				dom: null,
				domId: item.name,
				title: echartsTitleMap[item.name],
				data: item.data.map((itemData, index) => {
					let name = itemData.gatewayName
					if (
						itemData.gatewayName === '总数' &&
						(item.name === 'callList' || item.name === 'transferList')
					) {
						name = '总占比'
					} else {
						name = itemData.gatewayUserName
							? `${itemData.gatewayUserName}(${itemData.gatewayName})`
							: itemData.gatewayName
						name = name ?? itemData.gateway_id
					}
					return {
						name: String(name ?? ''),
						gatewayName: itemData.gatewayName ?? '',
						gateway_id: itemData.gateway_id ?? '',
						type: 'line',
						showSymbol: false,
						data: itemData.data ?? [[new Date().getTime(), 0]],
						lineStyle: {
							color: colors[index % 5]
						}
					}
				})
			}
		})
	}

	function claerAllDomAndInterval() {
		// 清除数据监控定时器
		if (intervalControlAllData) {
			clearInterval(intervalControlAllData)
		}
		echartsMapData.forEach((item) => {
			if (item.dom) {
				item.dom.clear()
				item.dom.dispose()
				item.dom = null
			}
		})
	}


	function formatDateToString(date) {
		const dateDay = date.toLocaleString().split(' ')[0]
		const datetime = date.toLocaleString().split(' ')[1]
		const dateDayMap = dateDay.split('/')
		dateDayMap[1] = dateDayMap[1].toString().padStart(2, '0')
		dateDayMap[2] = dateDayMap[2].toString().padStart(2, '0')
		return dateDayMap.join('-') + ' ' + datetime
	}
