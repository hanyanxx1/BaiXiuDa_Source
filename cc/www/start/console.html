<script>
	layui.config({
		base: '../src/',
		version: new Date().getTime()
	}).extend().use('index');

	var url = '/../'
	var address_url = "";
	var field_name_select = [];
	var field_name_xmselect = [];
	var status;
	var data_street = [];
	var project_id = 0;
	var project_fields; //表单字段
	var project_status; //客户状态
	var project_result = {}; //表单初始化值
	var info_uuid = "";
	var cdr_uuid;
	var info_telephone;
	var issue; //问卷
	var getProvince; //五级地址，获取省份，此处保存，就不用每次请求了
	var xiangzhenAddress = "";
	var lockReconnect = false; //避免ws重复连接
	var psccsocket = null; // 判断当前浏览器是否支持WebSocket
	var wsUrl;
	var cool;
	var info_city;


	var intervals;
	layui.use(['dropdown', 'form', 'table', 'xmSelect', 'element'], function () {
		table = layui.table;
		form = layui.form;
		var $ = layui.$;
		view = layui.view;
		admin = layui.admin;
		setter = layui.setter;
		xmSelect = layui.xmSelect;
		element = layui.element;
		var dropdown = layui.dropdown;

		var date = new Date();
					var year = date.getFullYear();
					var month = date.getMonth() + 1;
					if (month < 10) {
						month = "0" + month;
					}
					var day = date.getDate();
					if (day < 10) {
						day = "0" + day;
					}
					var starttime = year + "-" + month + "-" + day+" 00:00:00";
					var rankDate = year + "-" + month + "-" + day; // 【新增】用于排行榜查询

		var permission = layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["permission"];
		$("#phoneBtn").addClass("layui-btn layui-btn-disabled");

		if (window.location.protocol == "https:") {
			address_url = "https://addre.pscc.js.cn:8899/";
			wsUrl = "wss://" + window.location.host + "/agent/monitor?" +layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["access_token"];
		} else {
			address_url = "http://addre.pscc.js.cn:8898/";
			wsUrl = "ws://" + window.location.host + "/agent/monitor?" + layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["access_token"];
		}

		//绑定签入签出
		dropdown.render({
			elem: '.demo1',
			data: [{
				title: '签入',
				id: window.sessionStorage.getItem("name")
			}, {
				title: '签出',
				id: window.sessionStorage.getItem("name")
			}],
			click: function (obj) {
				if (obj.title == "签入") {
					console_tool.logon(obj.id);
				} else {
					console_tool.logout(obj.id);
				}
			}
		});
		$(function () {
			$.ajax({
				type: "GET",
				url: url + "menu/info",
				headers: {
					access_token: layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["access_token"]
				},
				success: function (res) {
					if (res.data.service_password == true) {
						$("#LAY-user-front-digits-submit").css("display", "");
						$("#LAY-user-front-10086").css("display", "");
					} else {
						$("#LAY-user-front-digits-submit").css("display", "none");
						$("#LAY-user-front-10086").css("display", "none");
					}
				}
			})
		})
		//查看号码
		form.on('submit(LAY-user-front-look-submit)', function(data) {
					if ($("#tel_phone").html()!="") {
						layer.load();
						$.ajax({
							url: url + 'admin/agent/searchRealNumber',
							type: 'post',
							headers: {
					access_token: layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["access_token"]
				},
							data: {
								uuid: cdr_uuid,
								start_stamp:starttime
							},
							success: function(obj) {
								layer.closeAll('loading');
								if(obj.msg!="查询成功！"){
									layer.msg(obj.msg,{icon:2});
								}
								else{
									info_telephone = formatTelephone(obj.data.realNumber);
									$("#tel_phone").html(formatTelephone(obj.data.realNumber)  + "【" + info_city + "】");
									layer.msg("限制查询次数："+obj.data.limit+" ，已使用次数："+ obj.data.count,
									{icon:1,time:5000});
								}

							}
						})
					}
				})


		//通话保持
		form.on('submit(LAY-user-front-hold)', function (data) {
			$.ajax({
				type: "post",
				url: url + "/admin/agent/hold",
				headers: {
					access_token: layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["access_token"]
				},
				data: {
					rnd: Math.random()
				},
				success: function (res) {
					layer.msg("操作成功", {
						icon: 1
					});
				}
			})
		})


		//服务评分
		form.on('submit(LAY-user-front-satisfaction)', function (data) {
			$.ajax({
				type: "post",
				url: url + "/admin/agent/satisfaction",
				headers: {
					access_token: layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["access_token"]
				},
				data: {
					rnd: Math.random()
				},
				success: function (res) {
					layer.msg("操作成功", {
						icon: 1
					});
				}
			})
		})


		form.on('submit(LAY-user-front-10086)', function (data) {
			$.ajax({
				type: "post",
				url: url + "admin/agent/customPlay",
				headers: {
					access_token: layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["access_token"]
				},
				data: {
					play_file: "10086.wav"
				},
				success: function (res) {
					layer.msg("操作成功", {
						icon: 1
					});
				}
			})
		})

		//多方通话
		form.on('submit(LAY-user-front-meeting)', function (data) {
			layer.prompt({
				title: '输入要通话的工号',
				formType: 0
			}, function (extno, index) {
				layer.close(index);
				$.ajax({
					type: "post",
					url: url + "/admin/agent/meeting",
					headers: {
						access_token: layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["access_token"]
					},
					data: {
						tel: extno,
						rnd: Math.random()
					},
					success: function (res) {
						layer.msg("操作成功", {
							icon: 1
						});
					}
				})
			});
		})

		form.on('submit(LAY-user-front-takeover-submit)',function(data){
			$.ajax({
					type: "post",
					url: url + "admin/agent/takeover",
					headers: {
						access_token: layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["access_token"]
					},
					success: function (res) {
						if(res.data == 0){
							layer.msg("介入失败", {
							icon: 2
						});
						}else{
							layer.msg("介入成功", {
							icon: 1
						});
						}
						
					}
				})
		})

		form.on('submit(LAY-user-front-send-submit)', function (data) {
			if ($("#send_msg").val() == "") {
				layer.msg("短信内容不能为空", {
					icon: 2
				});
				return;
			}

			layer.load();
			$.ajax({
				url: url + "/admin/sms_api/send",
				headers: {
					access_token: layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["access_token"]
				},
				type: 'post',
				data: {
					telephone: info_telephone,
					msg: $("#send_msg").val()
				},
				success: function (obj) {
					layer.closeAll('loading');
					if (obj.data == "fail") {
						layer.msg("发送失败", {
							icon: 2
						});
					} else {
						layer.msg("发送成功", {
							icon: 1
						});
					}

				}
			})
		})

		form.on('submit(LAY-user-front-cblack-submit)', function (data) {

			layer.load();
			$.ajax({
				url: url +
					"/admin/agent/addBlack",
				headers: {
					access_token: layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["access_token"]
				},
				type: 'post',
				data: {
					info_uuid: info_uuid
				},
				success: function (obj) {
					layer.closeAll('loading');
					if (obj.data > 0) {
						layer.msg("已添加黑名单", {
							icon: 1
						});
					} else {
						layer.msg("操作失败", {
							icon: 2
						});
					}

				}
			})
		})


		form.on('submit(LAY-user-front-digits-submit)', function (data) {

			layer.load();
			$.ajax({
				url: url +
					"/admin/agent/getDigits",
				headers: {
					access_token: layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["access_token"]
				},
				type: 'post',
				success: function (obj) {
					layer.closeAll('loading');
					if (obj.data == "") {
						layer.msg("没有设置按键", {
							icon: 2
						});
					} else {
						layer.msg(obj.data, {
							icon: 1
						});
					}

				}
			})
		})

		form.on('submit(LAY-user-front-call-submit)', function (data) {
			if (info_uuid == "") {
				layer.msg("客户信息不能为空", {
					icon: 2
				});
				return;
			}
			$.ajax({
				type: 'POST',
				url: layui.setter.configUrl + 'admin/agent/clickCall',
				headers: {
					access_token: layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["access_token"]
				},
				data: {
					info_uuid: info_uuid
				},
				success: function (data) {
					layer.msg("正在呼叫", {
						icon: 1
					});
				}
			});
		})

		//提交客户信息
		form.on('submit(LAY-user-front-customer-submit)', function (data) {
			var field = data.field; //获取提交的字段
			$.ajax({ //告诉服务端，坐席已结束弹屏
				type: "POST",
				url: url + "admin/agent/playScreen",
				headers: {
					access_token: layui.data('layuiAdmin')[window.sessionStorage.getItem("name")]["access_token"]
				},
				data: {

		function loadAgentRanking() {
			table.render({
				method: "post",

					date: rankDate
				},
				parseData: function (res) {
					function sortId(a, b) {
						return b.successCount - a.successCount;
					}
					// 严格判断并排序，防止后端异常返回导致报错
					var result = (res.data && Array.isArray(res.data)) ? res.data.sort(sortId) : [];

					var re = [];
					
					// 【核心修改】：限制最多只展示前十名，保护排名靠后员工的心态
					var displayLimit = result.length > 10 ? 10 : result.length;
					
					// 循环组装前端需要的数据格式
					for (var i = 0; i < displayLimit; i++) {
						var re1 = {};
						re1['工号'] = result[i].ext;
						re1['成功数'] = result[i].successCount;
						re1['姓名'] = result[i].name;
						re.push(re1);
					}
					return {
						"code": res.code || 0,
						"msg": res.msg,
						"count": re.length,
						"data": re
					};
				},
				cols: [
					[{
						title: '排名',
						align: 'center',
						type: 'numbers',
						width: 60
					}, {
						title: '姓名',
						align: 'center',

							var html = d.姓名;

								html += ' <img src="images/third.png" style="width:20px; height:20px; vertical-align:middle; margin-left:6px;" title="探花">';

	//网页软电话
	function getUserMedia(constrains, success, error) {
		if (navigator.mediaDevices.getUserMedia) {
			//最新标准API
			navigator.mediaDevices.getUserMedia(constrains).then(success).catch(error);
		} else if (navigator.webkitGetUserMedia) {
			//webkit内核浏览器
			navigator.webkitGetUserMedia(constrains).then(success).catch(error);
		} else if (navigator.mozGetUserMedia) {
			//Firefox浏览器
			navagator.mozGetUserMedia(constrains).then(success).catch(error);
		} else if (navigator.getUserMedia) {
			//旧版API
			navigator.getUserMedia(constrains).then(success).catch(error);
		}
	}

	function getForm(project_id) {

	function formatTelephone(phone) {
      let telArr = phone.split('')
      if (telArr && telArr.length === 11) {
        telArr.splice(3, 0 ,' ')
        telArr.splice(8, 0, ' ')
      }
      return telArr.join('')
    }
